data_dir: /data
sources:
  otel:
    type: opentelemetry
    decoding:
      codec: otlp
    http:
      address: 127.0.0.1:4318
    grpc:
      address: 127.0.0.1:4317
sinks:
  discard:
    type: blackhole
    inputs: [otel.traces, otel.logs, otel.metrics]
  forward:
    type: opentelemetry
    inputs: [otel.traces]
    healthcheck:
      enabled: false
    protocol:
      type: http
      uri: http://127.0.0.1:4319/v1/traces
      encoding:
        codec: otlp
