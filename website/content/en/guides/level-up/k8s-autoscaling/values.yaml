# Helm values for Vector, used across all phases of the k8s-autoscaling guide.
# Every phase applies this file through `helm upgrade` and overrides only the
# replica count and autoscaling settings needed for that phase. This keeps Helm
# as the sole owner of the Deployment and HPA desired state.
#
# Chart 0.58.0 pulls image tag 0.58.0-distroless-libc by default. The benchmark
# results in this guide were measured against that image; a different Vector
# version can shift the saturation point.

role: Stateless-Aggregator

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

customConfig:
  data_dir: /vector-data-dir

  api:
    enabled: true
    address: "0.0.0.0:8686"

  sources:
    in:
      type: http_server
      address: "0.0.0.0:9000"
      framing:
        method: newline_delimited
      decoding:
        codec: bytes

  transforms:
    apache_parser:
      inputs: ["in"]
      type: remap
      source: |
        . = parse_regex!(.message, r'^(?P<host>[\w\.]+) - (?P<user>[\w\-]+) \[(?P<timestamp>[^\]]*)\] "(?P<method>[\w]+) (?P<path>[^"]*)" (?P<status>[\d]+) (?P<bytes_out>[\d]+)$')

  sinks:
    out:
      inputs: ["apache_parser"]
      type: socket
      mode: tcp
      address: "consumer:9000"
      encoding:
        codec: json

readinessProbe:
  grpc:
    port: 8686
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

containerPorts:
  - name: http-in
    containerPort: 9000
    protocol: TCP
  - name: api
    containerPort: 8686
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 9000
      protocol: TCP
      targetPort: 9000
      name: http-in
    - port: 8686
      protocol: TCP
      targetPort: 8686
      name: api
