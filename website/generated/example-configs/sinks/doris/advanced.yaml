sinks:
  my_sink_id:
    type: doris
    inputs:
      - my-source-or-transform-id
    compression: none
    dangerously_allow_unconfined_template_resolution: false
    database: mydatabase
    encoding:
      codec: json
    endpoints:
      - http://127.0.0.1:8030
    label_prefix: vector
    log_request: false
    max_retries: -1
    table: mytable
