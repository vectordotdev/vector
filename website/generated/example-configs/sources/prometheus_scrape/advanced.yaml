sources:
  my_source_id:
    type: prometheus_scrape
    endpoints:
      - http://localhost:9090/metrics
    headers:
      X-My-Header:
        - value1
        - value2
    honor_labels: false
    query:
      "match[]":
        - '{job="somejob"}'
        - '{__name__=~"job:.*"}'
    scrape_interval_secs: 15
    scrape_timeout_secs: 5
