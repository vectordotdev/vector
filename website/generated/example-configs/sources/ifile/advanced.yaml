sources:
  my_source_id:
    type: ifile
    checkpoint_interval: 500
    data_dir: /var/local/lib/vector/
    exclude:
      - /var/log/binary-file.log
    file_key: file
    host_key: hostname
    ignore_checkpoints: false
    ignore_not_found: false
    ignore_older_secs: 600
    include:
      - /var/log/**/*.log
    line_delimiter: "\n"
    max_line_bytes: 102400
    max_read_bytes: 65536
    offset_key: offset
    oldest_first: false
    read_from: beginning
