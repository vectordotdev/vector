[package]
name = "opentelemetry-proto"
version = "0.1.0"
authors = ["Vector Contributors <vector@datadoghq.com>"]
edition = "2024"
publish = false

[lints]
workspace = true

[build-dependencies]
prost-build.workspace = true
tonic-build.workspace = true
glob.workspace = true

[dependencies]
bytes.workspace = true
chrono.workspace = true
hex = { version = "0.4.3", default-features = false, features = ["std"] }
indexmap = { workspace = true, optional = true }
ordered-float.workspace = true
prost.workspace = true
tonic.workspace = true
vrl.workspace = true
vector-common = { path = "../vector-common", default-features = false }
vector-core = { path = "../vector-core", default-features = false }

[features]
default = []
# Internal typed trace event (RFC 25329). Off by default until a source, transform, or sink consumes it.
typed-trace = ["dep:indexmap", "vector-core/typed-trace"]

[dev-dependencies]
proptest.workspace = true
similar-asserts.workspace = true
vector-core = { path = "../vector-core", default-features = false, features = ["test"] }
