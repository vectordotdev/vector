name: ECR Public Login
description: "Log Docker in to the ECR Public gallery (public.ecr.aws) so image pulls use the AWS account quota instead of the anonymous per-IP data limit shared by GitHub-hosted runners."

runs:
  using: "composite"
  steps:
    # Fork PRs don't get `id-token: write`, so ACTIONS_ID_TOKEN_REQUEST_URL is
    # unset. Read it via shell (env context only covers YAML-declared vars) and
    # skip the login when absent; pulls then stay anonymous.
    - name: Check OIDC token availability
      id: oidc
      shell: bash
      run: |
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    # Credentials are only exposed as step outputs, not exported to the job
    # environment, so later steps (e.g. the aws integration tests) never see them.
    # Best effort: a failure falls back to anonymous pulls instead of failing the job.
    - name: Get AWS credentials for ECR Public
      id: aws
      if: ${{ steps.oidc.outputs.available == 'true' }}
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::486234852809:role/vector-ecr-public-pull-github-actions
        aws-region: us-east-1 # ECR Public authentication is only available in us-east-1
        role-duration-seconds: 900
        allowed-account-ids: "486234852809"
        output-env-credentials: false
        output-credentials: true
        # The default 12 attempts spend ~45s on a deterministic AccessDenied.
        retry-max-attempts: 3

    - name: Login to ECR Public
      if: ${{ steps.aws.outcome == 'success' }}
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
      run: |
        if ! aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws; then
          echo "::warning title=ECR Public login failed::Continuing with anonymous public.ecr.aws pulls."
        fi

    - name: Warn about anonymous ECR Public pulls
      if: ${{ steps.oidc.outputs.available == 'true' && steps.aws.outcome != 'success' }}
      shell: bash
      run: echo "::warning title=ECR Public credentials unavailable::Could not assume vector-ecr-public-pull-github-actions; continuing with anonymous public.ecr.aws pulls."
