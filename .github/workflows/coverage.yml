# Coverage
#
# Temporary branch experiment: collect unit, component validation, CLI, API,
# integration, and E2E runner reports, validate their inventory and commit,
# then upload original reports with suite flags for Datadog to aggregate.
#
# Limitation: integration and E2E coverage only instruments the test runner
# (cargo-nextest), not the separately-launched Vector binary inside compose
# services. Instrumenting the service binary would require building it with
# cargo-llvm-cov and merging its runtime profdata, which is out of scope here.

name: Coverage

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string

  schedule:
    - cron: "0 2 * * 0" # 2 AM UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  preflight:
    name: Verify experiment and Datadog access
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pront-coverage-publisher-experiment'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/dd-token
        with:
          fail-on-error: "true"
      - name: Require a federated API key
        run: test -n "$DD_API_KEY"

  tests:
    needs: preflight
    if: ${{ github.repository == 'vectordotdev/vector' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/unit-tests.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      default: true
      coverage: true
      cli: true
      vector-api: true

  integration-tests:
    needs: preflight
    if: ${{ github.repository == 'vectordotdev/vector' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/integration.yml
    with:
      run_all: true
      coverage: true
      ref: ${{ needs.preflight.outputs.sha }}
    secrets: inherit

  coverage-upload:
    name: Validate and Publish Coverage
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - tests
      - integration-tests
    if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository == 'vectordotdev/vector' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - uses: ./.github/actions/setup
        with:
          mold: false
          vdev: false
          datadog-ci: true

      - name: Install manifest validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test publication guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_coverage_experiment.py' -v

      - name: Validate complete artifact collection
        env:
          TESTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: python3 .github/scripts/coverage-experiment.py publish coverage-artifacts --sha "$TESTED_SHA" --run-id "$GITHUB_RUN_ID"

      - name: Archive reports and expected coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-coverage-experiment
          path: |
            coverage-artifacts/
            coverage-evidence/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - uses: ./.github/actions/dd-token
        with:
          fail-on-error: "true"

      - name: Upload original reports to Datadog
        env:
          DD_SITE: datadoghq.com
          DD_ENV: ci
          TESTED_SHA: ${{ needs.preflight.outputs.sha }}
          COVERAGE_BRANCH: ${{ github.ref_name }}
        run: python3 .github/scripts/coverage-experiment.py publish coverage-artifacts --sha "$TESTED_SHA" --run-id "$GITHUB_RUN_ID" --upload
