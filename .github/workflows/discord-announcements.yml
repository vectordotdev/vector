name: Announce Discussions on Discord

on:
  discussion:
    types: [created]

permissions: {}

jobs:
  announce:
    if: github.repository == 'vectordotdev/vector' && github.event.discussion.category.slug == 'announcements'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_ANNOUNCEMENTS_WEBHOOK_URL is not configured"
            exit 1
          fi

          jq '{
            username: "Vector Announcements",
            allowed_mentions: {parse: []},
            embeds: [{
              title: .discussion.title[:256],
              url: .discussion.html_url,
              description: ((.discussion.body // "") |
                if length > 3500 then .[:3500] + "…" else . end)
            }]
          }' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/discord-announcement.json"

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/discord-announcement.json" \
            --output /dev/null \
            "${DISCORD_WEBHOOK_URL}?wait=true"
