# Deny - Linux
#
# Checks for security vulnerabilities or license incompatibilities
#
# Runs on:
#  - scheduled daily at 05:00 UTC
#  - on PR review (see ci-review-trigger.yml)
#  - on demand from github actions UI
#  - on pull requests when Cargo.toml or Cargo.lock files change
#  - in the merge queue
#
# Pull requests and merge queue runs only fail on cargo deny errors that the base revision does not
# also have, so a new advisory for an existing dependency does not fail every PR. The scheduled run
# reports those.

name: Deny - Linux

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string

  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 5 * * *" # Runs daily at 5:00 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/changes.yml
    secrets: inherit

  test-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Only set for pull requests and merge queue runs.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    if: &deny_gate >-
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.deny == 'true') &&
      (github.event_name != 'schedule' || github.repository == 'vectordotdev/vector')
    needs: [changes]
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout base
        if: env.BASE_SHA != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mold: false
          cargo-deny: true

      - name: Check cargo deny (all)
        if: env.BASE_SHA == ''
        run: make check-deny

      - name: Check cargo deny (new errors compared to base)
        if: env.BASE_SHA != ''
        run: |
          set -euo pipefail

          # Run `make check-deny` with the make arguments after $1 and write one
          # "<key>\t<crates>: <message>" line for each error to $1.
          deny_errors() {
            local result="$1"
            shift
            local output
            output="$(mktemp)"
            # Errors make the target fail, so look for the summary to see if cargo deny completed.
            make "$@" check-deny DENY_FORMAT=json &> "$output" || true
            if ! jq -R -e 'fromjson? | select(.type == "summary")' "$output" > /dev/null; then
              cat "$output"
              echo "::error::cargo deny did not complete (make $*)"
              return 1
            fi
            # Key on the advisory ID, so that a version change of an affected crate is not new.
            jq -R -r 'fromjson? | select(.type == "diagnostic" and .fields.severity == "error") | .fields
              | ((.graphs // []) | map(.Krate | "\(.name) \(.version)") | join(", ")) as $crates
              | [.advisory.id // "\(.code) \(.graphs[0].Krate.name)", "\($crates): \(.message)"]
              | @tsv' "$output" | sort -u > "$result"
          }

          head="$RUNNER_TEMP/head.tsv"
          base="$RUNNER_TEMP/base.tsv"
          deny_errors "$head"
          if [[ ! -s "$head" ]]; then
            echo "No errors found."
            exit 0
          fi

          # vdev checks the repository of the working directory, so this runs the Makefile and vdev
          # of this branch on the base. The base run fetches the advisory database after the run
          # above, so an advisory published in between can not show up on this branch only.
          deny_errors "$base" -C base -f "$GITHUB_WORKSPACE/Makefile" VDEV="$GITHUB_WORKSPACE/target/debug/vdev"

          # Compare FILENAME, not NR == FNR, which stays true for the head file if the base file is empty.
          existing="$(awk -F '\t' 'FILENAME == ARGV[1] { known[$1]; next } $1 in known' "$base" "$head")"
          new="$(awk -F '\t' 'FILENAME == ARGV[1] { known[$1]; next } !($1 in known)' "$base" "$head")"
          if [[ -n "$existing" ]]; then
            echo "Errors that the base also has (ignored):"
            echo "$existing"
          fi
          if [[ -z "$new" ]]; then
            echo "No new errors compared to $BASE_SHA."
            exit 0
          fi
          echo "New errors compared to $BASE_SHA:"
          echo "$new"
          echo "::error::This change adds cargo deny errors. Run 'make check-deny' for details."
          exit 1

  test-deny-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: *deny_gate
    needs: [changes]
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          mold: false
          cargo-deny: true

      - name: Check cargo deny licenses
        run: make check-deny-licenses
