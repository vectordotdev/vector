# Retain the workflow and job names for existing callers and required checks.
# The implementation uses native host tools, not cross-rs or QEMU.
name: Cross

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string

permissions:
  contents: read

jobs:
  cross-linux:
    name: Cross - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04-8core
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04-8core
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-8core-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-8core-arm
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04-8core-arm
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04-8core-arm
          - target: arm-unknown-linux-gnueabi
            runner: ubuntu-24.04-8core-arm
          - target: arm-unknown-linux-musleabi
            runner: ubuntu-24.04-8core-arm
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          rust: true
          mold: false
          vdev: false

      - uses: ./.github/actions/prepare-armv6-runtime
        if: startsWith(matrix.target, 'arm-unknown-linux-')

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache Cargo registry + index
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # Link the actual release features with fat LTO; cargo check is not enough.
      # Exercise the compatibility Make target as well as the shared vdev builder.
      - run: make NATIVE_VERIFY=true NATIVE_VDEV="cargo vdev" cross-build-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "vector-${{ matrix.target }}"
          path: "./target/${{ matrix.target }}/release/vector"
          if-no-files-found: error
