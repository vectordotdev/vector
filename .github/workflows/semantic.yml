# Validates PR titles against the Conventional Commits spec.
# See: https://www.conventionalcommits.org/en/v1.0.0/

name: "PR Title Check"

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Check PR Title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/PULL_REQUEST_TEMPLATE.md
          sparse-checkout-cone-mode: false
      - name: Validate conventional commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The valid types are defined in the PR template comment and pulled
          # from there so there is a single source of truth.
          types=$(sed -n 's/.*`type` = //p' .github/PULL_REQUEST_TEMPLATE.md | sed 's/(.*//' | tr -d '[:space:]' | tr ',' '|')
          if [ -z "$types" ]; then
            echo "Could not find the valid types in .github/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi
          pattern="^(${types})(\([a-zA-Z0-9_, -]+\))?!?: .+"
          if ! echo "$PR_TITLE" | grep -qP "$pattern"; then
            echo "PR title does not follow Conventional Commits format."
            echo "Expected: <type>(<optional scope>): <description>"
            echo "Valid types: ${types//|/, }"
            echo "Got: $PR_TITLE"
            exit 1
          fi
          echo "OK: $PR_TITLE"
