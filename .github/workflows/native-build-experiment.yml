name: Native build experiment

# Keep all experiments on the dedicated PR. No release or dispatch trigger.
on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/native-build-experiment.yml
      - scripts/native/**

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'thomas/native-release-builds' && github.event.pull_request.head.repo.full_name == github.repository
    name: Probe ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            image: alpine:3.23
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: alpine:3.23
          - runner: ubuntu-24.04-arm
            platform: linux/arm/v7
            image: alpine:3.23
          - runner: ubuntu-24.04-arm
            platform: linux/arm/v7
            image: debian:bookworm-slim
          - runner: ubuntu-24.04-arm
            platform: linux/arm/v5
            image: arm32v5/debian:bookworm-slim@sha256:cf9397e3198b2c002eb360586d341ba89154634198a26c578eb096b533b212cd
    steps:
      - name: Check native execution (no QEMU)
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: |
          uname -a
          if [ -d /proc/sys/fs/binfmt_misc ]; then
            ls -la /proc/sys/fs/binfmt_misc
            if grep -l qemu /proc/sys/fs/binfmt_misc/* 2>/dev/null; then
              echo '::error::QEMU is registered; this would not prove native execution'
              exit 1
            fi
          fi
          docker run --rm --platform "$PLATFORM" "$IMAGE" sh -euxc '
            uname -a
            if command -v apk; then
              apk add --no-cache build-base rust cargo cmake perl linux-headers protobuf-dev protobuf
            else
              apt-get update
              apt-get install -y --no-install-recommends gcc g++ libc6-dev curl ca-certificates musl-tools
            fi
            printf "#include <stdio.h>\nint main(void) { puts(\"native C works\"); }\n" >/tmp/probe.c
            cc /tmp/probe.c -o /tmp/probe
            /tmp/probe
            cc -dumpmachine
            if command -v rustc; then rustc -vV; fi
            if command -v musl-gcc; then musl-gcc /tmp/probe.c -static -o /tmp/probe-musl; /tmp/probe-musl; fi
          '

  musl:
    if: github.head_ref == 'thomas/native-release-builds' && github.event.pull_request.head.repo.full_name == github.repository
    name: Build native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04-8core
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-8core-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build native toolchain image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          RUST_VERSION=$(awk -F '"' '/^channel/ { print $2 }' rust-toolchain.toml)
          docker build --pull -f scripts/native/Dockerfile.alpine \
            --build-arg RUST_VERSION="$RUST_VERSION" \
            --build-arg RUST_HOST="$TARGET" \
            --build-arg RUST_TARGET="$TARGET" \
            -t vector-native .
      - name: Link Vector with the release feature set
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/work" \
            -e TARGET -e CARGO_PROFILE_RELEASE_LTO=thin \
            -e CARGO_BUILD_JOBS=6 \
            vector-native bash -euxo pipefail -c '
              rustc -vV
              # Use the native C/C++ toolchain and library search paths, not the
              # libstdc++ relocation required by the old cross images.
              CARGO_TARGET_KEY=$(echo "$TARGET" | tr "[:lower:]-" "[:upper:]_")
              export "CARGO_TARGET_${CARGO_TARGET_KEY}_RUSTFLAGS=-C target-feature=+crt-static"
              export "CARGO_TARGET_${CARGO_TARGET_KEY}_LINKER=cc"
              export RUSTFLAGS="-C target-feature=+crt-static"
              cargo build --locked --release --target "$TARGET" \
                --no-default-features --features "target-$TARGET"
              file="target/$TARGET/release/vector"
              if readelf -l "$file" | grep -q INTERP; then
                echo "musl artifact must not have a dynamic interpreter" >&2
                exit 1
              fi
              if readelf -d "$file" | grep -q NEEDED; then
                echo "musl artifact must not have dynamic dependencies" >&2
                exit 1
              fi
              "$file" --version
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vector
          if-no-files-found: error

  arm-toolchains:
    if: github.head_ref == 'thomas/native-release-builds' && github.event.pull_request.head.repo.full_name == github.repository
    name: Probe Rust host ${{ matrix.host }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.23
            platform: linux/arm/v7
            host: armv7-unknown-linux-gnueabihf
            target: armv7-unknown-linux-musleabihf
          - image: arm32v5/debian:bookworm-slim@sha256:cf9397e3198b2c002eb360586d341ba89154634198a26c578eb096b533b212cd
            platform: linux/arm/v5
            host: arm-unknown-linux-gnueabi
            target: arm-unknown-linux-gnueabi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install and execute the pinned Rust toolchain
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          RUST_HOST: ${{ matrix.host }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          RUST_VERSION=$(awk -F '"' '/^channel/ { print $2 }' rust-toolchain.toml)
          export RUST_VERSION
          docker run --rm --platform "$PLATFORM" \
            -e RUST_HOST -e RUST_TARGET -e RUST_VERSION "$IMAGE" sh -euxc '
              if command -v apk; then
                apk add --no-cache build-base curl gcompat libstdc++ bash
              else
                apt-get update
                apt-get install -y --no-install-recommends build-essential curl ca-certificates
              fi
              curl --retry 5 -fsSL "https://static.rust-lang.org/rustup/dist/$RUST_HOST/rustup-init" -o /tmp/rustup-init
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --no-modify-path --profile minimal \
                --default-host "$RUST_HOST" --default-toolchain "$RUST_VERSION" --target "$RUST_TARGET"
              export PATH="$HOME/.cargo/bin:$PATH"
              rustc -vV
              printf "fn main() { println!(\"native Rust works\"); }\n" >/tmp/probe.rs
              rustc --target "$RUST_TARGET" /tmp/probe.rs -o /tmp/probe
              /tmp/probe
            '
