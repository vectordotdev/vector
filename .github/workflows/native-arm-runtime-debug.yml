name: ARMv6 runtime diagnostics

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read

jobs:
  debug:
    if: >-
      github.repository == 'vectordotdev/vector' &&
      github.event.pull_request.number == 27197 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'thomasqueirozb' &&
      github.event.review.body == '/ci-run-native-armv6-runtime'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm-unknown-linux-gnueabi
            source-run: 43950675022
          - target: arm-unknown-linux-musleabi
            source-run: 43949196956
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Retrieve the completed production-profile binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: debug-data
          github-token: ${{ github.token }}
          run-id: ${{ matrix.source-run }}
      - name: Build a native ARM64 debugger environment
        run: |
          if grep -l qemu /proc/sys/fs/binfmt_misc/* 2>/dev/null; then
            echo '::error::Runtime diagnostics must use the native ARM32 kernel support'
            exit 1
          fi
          docker build --platform linux/arm64 -t vector-runtime-debug - <<'DOCKERFILE'
          FROM debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
          RUN dpkg --add-architecture armel && apt-get update \
            && apt-get install -y --no-install-recommends \
              bash gdb-multiarch procps libc6:armel libgcc-s1:armel \
              libatomic1:armel zlib1g:armel \
            && rm -rf /var/lib/apt/lists/*
          WORKDIR /work
          DOCKERFILE
      - name: Capture native thread backtraces without rebuilding Vector
        run: |
          docker run --rm --platform linux/arm64 --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined -v "$PWD:/work" -e TARGET \
            vector-runtime-debug bash -euxo pipefail -c '
              file="debug-data/$TARGET/release/vector"
              chmod +x "$file"
              prefix="debug-data/$TARGET"
              printf "native packaging works\n" > /tmp/native-input
              VECTOR_LOG=trace "$file" --config tests/data/native-release-smoke.yaml \
                </tmp/native-input >"$prefix.stdout.txt" 2>"$prefix.stderr.txt" &
              pid=$!
              sleep 5
              if kill -0 "$pid" 2>/dev/null; then
                ps -L -p "$pid" -o pid,tid,pcpu,rss,wchan,comm >"$prefix.threads.txt"
                timeout -k 5 30 gdb-multiarch --batch \
                  -ex "set pagination off" -ex "thread apply all bt" \
                  -ex "info registers" -ex "x/24i \$pc-32" \
                  -p "$pid" >"$prefix.gdb.txt" 2>&1 || true
                kill -KILL "$pid" 2>/dev/null || true
              fi
              status=0
              wait "$pid" || status=$?
              for log in "$prefix".*.txt; do
                printf "\n--- %s ---\n" "$log"
                tail -n 200 "$log"
              done
              if [ "$status" != 0 ] && [ "$status" != 137 ]; then
                exit "$status"
              fi
            '
      - name: Test hardware execution of ARMv6 memory barriers
        run: |
          previous=$(sysctl -n abi.cp15_barrier)
          trap 'sudo sysctl -w "abi.cp15_barrier=$previous"' EXIT
          sudo sysctl -w abi.cp15_barrier=2
          docker run --rm --platform linux/arm64 -v "$PWD:/work" -e TARGET \
            vector-runtime-debug bash -euxo pipefail -c '
              file="debug-data/$TARGET/release/vector"
              timeout -k 5 20 "$file" --version
              printf "native packaging works\n" | timeout -k 5 20 "$file" \
                --config tests/data/native-release-smoke.yaml \
                >"debug-data/$TARGET.hardware.stdout.txt"
              grep -F "NATIVE PACKAGING WORKS" "debug-data/$TARGET.hardware.stdout.txt"
            '
      - name: Install packaging tools without rebuilding Vector
        uses: ./.github/actions/setup
        with:
          rust: true
          mold: false
          cargo-deb: true
          cmark-gfm: true
          cross-binutils: true
      - name: Generate packaging test metadata
        id: metadata
        env:
          CHANNEL: custom
        run: make ci-generate-publish-metadata
      - uses: ./.github/actions/prepare-armv6-runtime
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the existing binary and verify its ARM1176 image
        env:
          VECTOR_VERSION: ${{ steps.metadata.outputs.vector_version }}
          CHANNEL: test
          PUSH: "false"
          LOAD: "true"
          REPOS: vector-runtime-debug
          PLATFORM: linux/arm/v6
        run: |
          mkdir -p "target/$TARGET/release"
          cp "debug-data/$TARGET/release/vector" "target/$TARGET/release/vector"
          digest=$(sha256sum "target/$TARGET/release/vector")
          if [[ "$TARGET" == *gnueabi ]]; then
            printf 'native packaging works\n' | timeout -k 10 90 docker run --rm -i \
              --platform linux/arm/v5 -v "$PWD:/work:ro" \
              --entrypoint "/work/target/$TARGET/release/vector" debian:bullseye-slim \
              --config /work/tests/data/native-release-smoke.yaml > "$RUNNER_TEMP/gnu-compat.json"
            grep -F '"message":"NATIVE PACKAGING WORKS"' "$RUNNER_TEMP/gnu-compat.json"
          fi
          make PREBUILT=true VERSION="$VECTOR_VERSION" VDEV="$(command -v vdev)" "package-$TARGET-all"
          printf '%s\n' "$digest" | sha256sum --check -
          export BASE=alpine
          if [[ "$TARGET" == *gnueabi ]]; then
            export BASE=debian
          fi
          export TAG="$VECTOR_VERSION"
          make release-docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-debug-${{ matrix.target }}
          path: debug-data/*.txt
          if-no-files-found: warn
