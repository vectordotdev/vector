name: Protobuf Compatibility

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/protobuf.yml"
      - "buf.vector.yaml"
      - "proto/**"
      - "lib/vector-core/proto/**"
  merge_group:
    types: [checks_requested]

concurrency:
  # `github.ref` is unique for MQ runs and PRs
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-protos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Run `git checkout`
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Perform breaking change detection against the `master` branch
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint: false
          format: false
          breaking: true
          breaking_against: "https://github.com/vectordotdev/vector.git#branch=master"
          push: false
          archive: false
          pr_comment: false
      # Keep vendored protos in their upstream format.
      - name: Check owned protobuf style
        run: |
          for proto in \
            lib/vector-core/proto/event.proto \
            proto/vector/observability.proto \
            proto/vector/vector.proto
          do
            buf format "$proto" --diff --exit-code
            buf lint --config buf.vector.yaml --path "$proto"
          done
