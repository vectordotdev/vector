name: Protobuf Compatibility

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "proto/**"
      - "lib/vector-core/proto/**"
  merge_group:
    types: [checks_requested]

concurrency:
  # `github.ref` is unique for MQ runs and PRs
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-protos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Run `git checkout`
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Perform breaking change detection against the `master` branch
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint: false
          format: false
          breaking: true
          breaking_against: "https://github.com/vectordotdev/vector.git#branch=master"
          push: false
          archive: false
          pr_comment: false
