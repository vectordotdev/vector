name: Tag approved release

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-autotag
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release merge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_branch: ${{ steps.validation.outputs.release_branch }}
      tag: ${{ steps.validation.outputs.tag }}
      tag_required: ${{ steps.validation.outputs.tag_required }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up vdev
        uses: ./.github/actions/setup
        with:
          cargo-cache: true
          rust: true
          vdev: false

      - name: Validate release transition
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo vdev release workflow autotag-check
          --before-sha "${{ github.event.before }}"
          --sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"

  tag:
    name: Create release tag
    needs: validate
    if: needs.validate.outputs.tag_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release refs
        env:
          RELEASE_BRANCH: ${{ needs.validate.outputs.release_branch }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v${version}" ]]
          [[ "$RELEASE_BRANCH" == "${TAG%.*}" ]]

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create tag and release branch with Vector bot token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.release_branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "$TAG already points at $GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          git push --atomic origin "$TAG" "HEAD:refs/heads/${RELEASE_BRANCH}"
