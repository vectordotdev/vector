name: Release Suite

permissions:
  contents: read

on:
  push:
    tags:
      - v0.*
      - v1.*

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.state.outputs.version }}
      next_version: ${{ steps.state.outputs.next_version }}
      housekeeping_required: ${{ steps.state.outputs.housekeeping_required }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up vdev
        uses: ./.github/actions/setup
        with:
          cargo-cache: true
          rust: true
          vdev: false

      - name: Validate release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo vdev release workflow publication-check
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"

  Release:
    needs: preflight
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      git_ref: ${{ github.ref }}
      channel: release
    secrets: inherit

  housekeeping:
    name: Generate post-release housekeeping
    needs: [preflight, Release]
    if: needs.preflight.outputs.housekeeping_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: release-housekeeping
      cancel-in-progress: false
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      - name: Checkout master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Record frozen base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up release tooling
        uses: ./.github/actions/setup
        with:
          cargo-cache: true
          rust: true
          protoc: true
          dd-rust-license-tool: true
          vdev: false

      - name: Validate housekeeping state
        id: preflight
        run: >-
          cargo vdev release workflow housekeeping-check
          --version "${{ needs.preflight.outputs.version }}"
          --release-commit "$GITHUB_SHA"

      - name: Generate housekeeping change
        if: steps.preflight.outputs.skip != 'true'
        run: >-
          cargo vdev release workflow housekeeping-prepare
          --version "${{ needs.preflight.outputs.version }}"
          --release-commit "$GITHUB_SHA"

      - name: Refresh dependency files
        if: steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/release-dependencies

      - name: Package housekeeping changes
        if: steps.preflight.outputs.skip != 'true'
        run: |
          git diff --binary "${{ steps.base.outputs.sha }}" \
            > "$RUNNER_TEMP/release-housekeeping.patch"
          test -s "$RUNNER_TEMP/release-housekeeping.patch"

      - name: Upload housekeeping changes
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-housekeeping
          path: ${{ runner.temp }}/release-housekeeping.patch
          if-no-files-found: error
          retention-days: 1

  open-housekeeping:
    name: Open post-release housekeeping PR
    needs: [preflight, housekeeping]
    if: >-
      needs.preflight.outputs.housekeeping_required == 'true' &&
      needs.housekeeping.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Checkout frozen master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Download housekeeping changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-housekeeping
          path: ${{ runner.temp }}/release-housekeeping

      - name: Validate and commit housekeeping changes
        env:
          BASE_SHA: ${{ needs.housekeeping.outputs.base_sha }}
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.0-dev$ ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]

          git apply --index --binary \
            "$RUNNER_TEMP/release-housekeeping/release-housekeeping.patch"
          while IFS= read -r file; do
            case "$file" in
              Cargo.toml|Cargo.lock|LICENSE-3rdparty.csv|\
              .github/release-state.json|docs/generated/*) ;;
              *) echo "Unexpected housekeeping file: $file" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --quiet && exit 1
          jq -e --arg next "$NEXT_VERSION" --arg version "$VERSION" \
            --arg tag "v${VERSION}" --arg commit "$RELEASE_COMMIT" \
            '.schema_version == 1 and .status == "development" and
             .version == $next and .last_release.version == $version and
             .last_release.tag == $tag and .last_release.commit == $commit' \
            .github/release-state.json >/dev/null

          git config user.name "vectordotdev-bot[bot]"
          git config user.email "vectordotdev-bot[bot]@users.noreply.github.com"
          git commit -m "chore(releasing): begin ${NEXT_VERSION}"

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or refresh housekeeping PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_APP: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.preflight.outputs.version }}
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
        run: |
          set -euo pipefail
          branch="release/housekeeping-v${VERSION}"
          gh auth setup-git
          prs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=master \
            -f head="${GITHUB_REPOSITORY%/*}:${branch}")
          jq -e --arg author "${BOT_APP}[bot]" --arg repo "$GITHUB_REPOSITORY" \
            'length <= 1 and all(.[];
              .user.login == $author and .head.repo.full_name == $repo)' \
            <<< "$prs" >/dev/null

          number=$(jq -r '.[0].number // empty' <<< "$prs")
          if [[ -n "$number" ]]; then
            git fetch origin "refs/heads/${branch}"
            [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$(git rev-parse 'HEAD^{tree}')" ]]
            head_sha=$(git rev-parse FETCH_HEAD)
          else
            status=0
            git ls-remote --exit-code --heads origin "$branch" >/dev/null || status=$?
            [[ "$status" == 2 ]]
            git push origin "HEAD:refs/heads/${branch}"
            head_sha=$(git rev-parse HEAD)
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master \
              --head "$branch" --title "chore(releasing): begin ${NEXT_VERSION}" \
              --label no-changelog \
              --body "Housekeeping after v${VERSION}: begin ${NEXT_VERSION}, restore VRL main, and refresh dependency files. Merged automatically only after required checks pass.")
            number=${url##*/}
          fi
          printf 'pr_number=%s\nhead_sha=%s\n' "$number" "$head_sha" >> "$GITHUB_OUTPUT"
          echo "Housekeeping PR #${number} at ${head_sha}." >> "$GITHUB_STEP_SUMMARY"

  merge-housekeeping:
    name: Merge checked housekeeping commit
    needs: open-housekeeping
    if: needs.open-housekeeping.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      checks: read
    env:
      PR_NUMBER: ${{ needs.open-housekeeping.outputs.pr_number }}
      HEAD_SHA: ${{ needs.open-housekeeping.outputs.head_sha }}
    steps:
      - name: Wait for release validation
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ needs.open-housekeeping.outputs.head_sha }}
          repo-token: ${{ github.token }}
          check-name: Validate release state transition
          allowed-conclusions: success
          checks-discovery-timeout: 300
          wait-interval: 15

      - name: Wait for checks on the generated commit
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ needs.open-housekeeping.outputs.head_sha }}
          repo-token: ${{ github.token }}
          running-workflow-name: Merge checked housekeeping commit
          check-regexp: ".+"
          allowed-conclusions: success,skipped,neutral
          checks-discovery-timeout: 300
          wait-interval: 15

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Queue only the generated commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$HEAD_SHA"
          echo "Submitted housekeeping PR #${PR_NUMBER} at ${HEAD_SHA} for merge." \
            >> "$GITHUB_STEP_SUMMARY"
