name: Release Suite

permissions:
  contents: read

on:
  push:
    tags:
      - v0.*
      - v1.*

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.state.outputs.version }}
      next_version: ${{ steps.state.outputs.next_version }}
      housekeeping_required: ${{ steps.state.outputs.housekeeping_required }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up vdev
        uses: ./.github/actions/setup
        with:
          cargo-cache: true
          rust: true
          vdev: false

      - name: Validate release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo vdev release workflow publication-check
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"

  Release:
    needs: preflight
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      git_ref: ${{ github.ref }}
      channel: release
    secrets: inherit

  housekeeping:
    name: Open post-release housekeeping PR
    needs: [preflight, Release]
    if: needs.preflight.outputs.housekeeping_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: release-housekeeping
      cancel-in-progress: false
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Checkout master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release tooling
        uses: ./.github/actions/setup
        with:
          cargo-cache: true
          rust: true
          protoc: true
          dd-rust-license-tool: true
          vdev: false

      - name: Validate housekeeping state
        id: preflight
        run: >-
          cargo vdev release workflow housekeeping-check
          --version "${{ needs.preflight.outputs.version }}"
          --release-commit "$GITHUB_SHA"

      - name: Generate housekeeping change
        if: steps.preflight.outputs.skip != 'true'
        run: >-
          cargo vdev release workflow housekeeping-prepare
          --version "${{ needs.preflight.outputs.version }}"
          --release-commit "$GITHUB_SHA"

      - name: Refresh dependency files
        if: steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/release-dependencies

      # Mint write credentials only after generation, so dependency builds have
      # no write token and cannot consume its one-hour lifetime.
      - name: Create Vector bot token
        if: steps.preflight.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or refresh housekeeping PR
        if: steps.preflight.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_APP: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.preflight.outputs.version }}
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
        run: bash scripts/release-housekeeping-pr.sh

  merge-housekeeping:
    name: Merge checked housekeeping commit
    needs: housekeeping
    if: needs.housekeeping.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      checks: read
    env:
      PR_NUMBER: ${{ needs.housekeeping.outputs.pr_number }}
      HEAD_SHA: ${{ needs.housekeeping.outputs.head_sha }}
    steps:
      - name: Wait for release validation
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ needs.housekeeping.outputs.head_sha }}
          repo-token: ${{ github.token }}
          check-name: Validate release state transition
          allowed-conclusions: success
          checks-discovery-timeout: 300
          wait-interval: 15

      - name: Wait for checks on the generated commit
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ needs.housekeeping.outputs.head_sha }}
          repo-token: ${{ github.token }}
          running-workflow-name: Merge checked housekeeping commit
          check-regexp: ".+"
          allowed-conclusions: success,skipped,neutral
          checks-discovery-timeout: 300
          wait-interval: 15

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge only the generated commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The app needs a required-review bypass, NOT a status-check bypass.
          # GitHub rechecks required checks, base freshness, and the expected SHA.
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="$HEAD_SHA" -f merge_method=squash --jq '.merged' | grep -qx true
          echo "Merged housekeeping PR #${PR_NUMBER} at ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
