name: Prepare post-release housekeeping

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_commit:
        required: true
        type: string

permissions:
  contents: read # Restrictive default
  pull-requests: read # List associated preparation PRs during state checks

concurrency:
  group: release-housekeeping
  queue: max
  cancel-in-progress: false

jobs:
  generate:
    name: Generate housekeeping changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      skip: ${{ steps.state.outputs.skip }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - name: Checkout master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Record base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up housekeeping tooling
        uses: ./.github/actions/setup
        with:
          rust: true
          cargo-cache: true
          protoc: true
          dd-rust-license-tool: true
          vdev: true

      - name: Check housekeeping state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          "$VDEV" release workflow housekeeping-check
          --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT"
          --repository "$GITHUB_REPOSITORY"

      - name: Require active release freeze
        if: steps.state.outputs.skip != 'true'
        uses: ./.github/actions/require-release-freeze
        with: &release-bot
          app-client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          freeze-ruleset-id: ${{ vars.RELEASE_FREEZE_RULESET_ID }}
          bot-bypass-ruleset-ids: ${{ vars.RELEASE_FREEZE_BOT_BYPASS }}

      - name: Generate housekeeping
        if: steps.state.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          "$VDEV" release workflow housekeeping-prepare
          --version "$VERSION" --release-commit "$RELEASE_COMMIT"

      - name: Install VRL documentation builder
        if: steps.state.outputs.skip != 'true'
        uses: ./.github/actions/install-vrl-doc-builder

      - name: Refresh dependency files
        if: steps.state.outputs.skip != 'true'
        run: make build-licenses generate-vector-vrl-docs

      - name: Package housekeeping changes
        if: steps.state.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git add --all
          git diff --cached --binary "$BASE_SHA" > "$RUNNER_TEMP/housekeeping.patch"
          test -s "$RUNNER_TEMP/housekeeping.patch"

      - name: Upload housekeeping changes
        if: steps.state.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-housekeeping
          path: ${{ runner.temp }}/housekeeping.patch
          if-no-files-found: error
          retention-days: 1

  push-master:
    name: Push housekeeping to master
    needs: generate
    if: needs.generate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ needs.generate.outputs.base_sha }}
      VERSION: ${{ needs.generate.outputs.version }}
    steps:
      - name: Checkout frozen master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Require active release freeze
        uses: ./.github/actions/require-release-freeze
        with: *release-bot

      - name: Set up trusted validator
        uses: ./.github/actions/setup
        with:
          rust: true
          cargo-cache: true
          vdev: true

      - name: Verify frozen base
        run: |
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]

      - name: Download housekeeping changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-housekeeping
          path: ${{ runner.temp }}/housekeeping

      - name: Validate housekeeping changes
        run: |
          git apply --index --binary "$RUNNER_TEMP/housekeeping/housekeeping.patch"
          git config user.name "vectordotdev-bot[bot]"
          git config user.email "vectordotdev-bot[bot]@users.noreply.github.com"
          git commit -m "chore(releasing): housekeeping after v${VERSION}"
          # Validate the checked housekeeping commit exactly as the release
          # PR checklist would: only Cargo.toml/Cargo.lock dependency and
          # documentation refreshes on the frozen base.
          "$VDEV" release workflow pr-check \
            --base-sha "$BASE_SHA" --head-ref "release/housekeeping-v${VERSION}"

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push housekeeping to master
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # All remote git operations go through the token-authenticated URL. The
          # checkout ran with persist-credentials: false, so origin has no credentials.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          master=$(git ls-remote "$remote" refs/heads/master)
          master=${master%%$'\t'*}
          [[ "$master" == "$BASE_SHA" ]] || {
            echo "master moved since housekeeping was generated; re-run this workflow." >&2
            exit 1
          }

          # Plain non-force push: if master raced ahead since the check above,
          # the push is rejected rather than rewriting history. Re-run this
          # workflow from the new master; never rebase, retry, or force-push.
          git push "$remote" HEAD:refs/heads/master

          echo "Pushed housekeeping commit $(git rev-parse HEAD) to master after v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
