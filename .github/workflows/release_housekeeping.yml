name: Prepare post-release housekeeping

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_commit:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: release-housekeeping
  queue: max
  cancel-in-progress: false

jobs:
  generate:
    name: Generate housekeeping changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      branch: ${{ steps.state.outputs.branch }}
      skip: ${{ steps.state.outputs.skip }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - name: Checkout master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Record base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up housekeeping tooling
        uses: ./.github/actions/setup
        with:
          rust: true
          cargo-cache: true
          protoc: true
          dd-rust-license-tool: true
          vdev: false

      - name: Check housekeeping state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          cargo vdev release workflow housekeeping-check
          --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT"
          --repository "$GITHUB_REPOSITORY"

      - name: Require active release freeze
        if: steps.state.outputs.skip != 'true'
        uses: ./.github/actions/require-release-freeze

      - name: Generate housekeeping
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.resume != 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          cargo vdev release workflow housekeeping-prepare
          --version "$VERSION" --release-commit "$RELEASE_COMMIT"

      - name: Install VRL documentation builder
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.resume != 'true'
        uses: ./.github/actions/install-vrl-doc-builder

      - name: Refresh dependency files
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.resume != 'true'
        run: make build-licenses generate-vector-vrl-docs

      - name: Resume an already published branch
        if: steps.state.outputs.skip != 'true' && steps.state.outputs.resume == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: ${{ steps.state.outputs.branch }}
        run: |
          cp target/debug/vdev "$RUNNER_TEMP/release-vdev"
          git fetch --no-tags origin "refs/heads/$BRANCH"
          git switch --detach FETCH_HEAD
          "$RUNNER_TEMP/release-vdev" release workflow pr-check \
            --base-sha "$BASE_SHA" --head-ref "$BRANCH"

      - name: Package housekeeping changes
        if: steps.state.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git add --all
          git diff --cached --binary "$BASE_SHA" > "$RUNNER_TEMP/housekeeping.patch"
          test -s "$RUNNER_TEMP/housekeeping.patch"

      - name: Upload housekeeping changes
        if: steps.state.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-housekeeping
          path: ${{ runner.temp }}/housekeeping.patch
          if-no-files-found: error
          retention-days: 1

  open-pr:
    name: Open housekeeping PR
    needs: generate
    if: needs.generate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    env:
      BASE_SHA: ${{ needs.generate.outputs.base_sha }}
      BRANCH: ${{ needs.generate.outputs.branch }}
    steps:
      - name: Checkout frozen master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Require active release freeze
        uses: ./.github/actions/require-release-freeze

      - name: Set up trusted validator
        uses: ./.github/actions/setup
        with:
          rust: true
          cargo-cache: true
          vdev: false

      - name: Build trusted validator
        run: |
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          cargo build --locked -p vdev

      - name: Download housekeeping changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-housekeeping
          path: ${{ runner.temp }}/housekeeping

      - name: Validate and commit housekeeping
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          git apply --index --binary "$RUNNER_TEMP/housekeeping/housekeeping.patch"
          git config user.name "vectordotdev-bot[bot]"
          git config user.email "vectordotdev-bot[bot]@users.noreply.github.com"
          git commit -m "chore(releasing): housekeeping after v${VERSION}"
          target/debug/vdev release workflow pr-check --base-sha "$BASE_SHA" --head-ref "$BRANCH"

      - name: Reuse an identical published branch
        run: |
          if [[ -n "$(git ls-remote origin "refs/heads/$BRANCH")" ]]; then
            git fetch --no-tags origin "refs/heads/$BRANCH"
            git diff --exit-code HEAD FETCH_HEAD
            git switch --detach FETCH_HEAD
            target/debug/vdev release workflow pr-check --base-sha "$BASE_SHA" --head-ref "$BRANCH"
          fi
          master=$(git ls-remote origin refs/heads/master)
          [[ "${master%%$'\t'*}" == "$BASE_SHA" ]]

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open housekeeping PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$BRANCH"
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
            --app vectordotdev-bot --state open --json url --jq '.[0].url // empty')
          if [[ -z "$url" ]]; then
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "chore(releasing): housekeeping after v${VERSION}" --label no-changelog \
              --body "Begin the next minor development version, restore VRL main, and refresh dependency files after successful publication of v${VERSION}. The release workflow squash-merges the validated commit after checks pass, while the release freeze remains active.")
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Housekeeping PR: $url" >> "$GITHUB_STEP_SUMMARY"

  merge-pr:
    name: Merge checked housekeeping commit
    needs: [generate, open-pr]
    # Also resume an existing PR when generation skipped it on a workflow retry.
    # A completed release has no branch output and must not attempt another merge.
    if: >-
      !cancelled() && needs.generate.result == 'success' &&
      needs.generate.outputs.branch != '' &&
      (needs.open-pr.result == 'success' || needs.open-pr.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Select housekeeping commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.generate.outputs.branch }}
          EXPECTED_HEAD: ${{ needs.open-pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
            --app vectordotdev-bot --state open --json number,headRefOid,isCrossRepository)
          jq -e 'length == 1 and .[0].isCrossRepository == false' <<< "$prs" >/dev/null
          number=$(jq -r '.[0].number' <<< "$prs")
          head_sha=$(jq -r '.[0].headRefOid' <<< "$prs")
          [[ -z "$EXPECTED_HEAD" || "$head_sha" == "$EXPECTED_HEAD" ]]
          printf 'number=%s\nhead_sha=%s\n' "$number" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for release validation
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          repo-token: ${{ github.token }}
          check-name: Validate release state transition
          allowed-conclusions: success
          checks-discovery-timeout: 300
          wait-interval: 15

      - name: Wait for checks on the selected commit
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          repo-token: ${{ github.token }}
          running-workflow-name: Merge checked housekeeping commit
          check-regexp: ".+"
          allowed-conclusions: success,skipped,neutral
          checks-discovery-timeout: 300
          wait-interval: 15

      - name: Checkout release automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_commit }}
          sparse-checkout: .github/actions/require-release-freeze
          persist-credentials: false

      - name: Require active release freeze
        uses: ./.github/actions/require-release-freeze

      - name: Create Vector bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_VECTORDOTDEV_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge only the checked commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          [[ "$master" == "$BASE_SHA" ]]
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,baseRefName,headRefOid | \
            jq -e --arg head "$HEAD_SHA" \
              '.state == "OPEN" and .baseRefName == "master" and .headRefOid == $head' >/dev/null
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --admin --match-head-commit "$HEAD_SHA"
          echo "Merged housekeeping PR #${PR_NUMBER} at ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
