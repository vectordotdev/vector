name: Native ARM build experiment

# Run /ci-run-native-arm in a review on this PR, not on every edit.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event.pull_request.number == 27197 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'thomasqueirozb' &&
      contains(fromJSON('["/ci-run-native-arm", "/ci-run-native-armv6", "/ci-run-native-armv7"]'), github.event.review.body)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: plan
        with:
          script: |
            const armel = 'arm32v5/debian:bookworm-slim@sha256:cf9397e3198b2c002eb360586d341ba89154634198a26c578eb096b533b212cd';
            const targets = [
              {
                target: 'armv7-unknown-linux-gnueabihf', platform: 'linux/arm/v7',
                dockerfile: 'scripts/native/Dockerfile.arm-gnu',
                base: 'debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc',
              },
              {
                target: 'arm-unknown-linux-gnueabi', platform: 'linux/arm/v5',
                dockerfile: 'scripts/native/Dockerfile.arm-gnu', base: armel,
              },
              {
                target: 'armv7-unknown-linux-musleabihf', platform: 'linux/arm/v7',
                dockerfile: 'scripts/native/Dockerfile.armv7-musl', base: 'unused',
                'build-target': 'armv7-alpine-linux-musleabihf',
              },
              {
                target: 'arm-unknown-linux-musleabi', platform: 'linux/arm/v5',
                dockerfile: 'scripts/native/Dockerfile.arm-musl', base: armel,
              },
            ];
            const command = context.payload.review.body;
            const selected = command === '/ci-run-native-armv6'
              ? targets.filter(t => t.target.startsWith('arm-'))
              : command === '/ci-run-native-armv7'
                ? targets.filter(t => t.target.startsWith('armv7-'))
                : targets;
            core.setOutput('matrix', JSON.stringify(selected));

  arm:
    needs: plan
    name: Build native ${{ matrix.target }}
    runs-on: ubuntu-24.04-8core-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - name: Build native ARM toolchain
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BASE: ${{ matrix.base }}
        run: |
          if grep -l qemu /proc/sys/fs/binfmt_misc/* 2>/dev/null; then
            echo '::error::This test must not use QEMU'
            exit 1
          fi
          RUST_VERSION=$(awk -F '"' '/^channel/ { print $2 }' rust-toolchain.toml)
          if [[ "$TARGET" == arm-unknown-linux-musleabi ]]; then
            docker build --pull --platform "$PLATFORM" -f scripts/native/Dockerfile.arm-gnu \
              --build-arg BASE="$BASE" --build-arg RUST_VERSION="$RUST_VERSION" \
              --build-arg RUST_HOST=arm-unknown-linux-gnueabi -t vector-native-arm-gnu .
            docker build --platform "$PLATFORM" -f "$DOCKERFILE" \
              --build-arg RUST_VERSION="$RUST_VERSION" -t vector-native-arm .
          else
            docker build --pull --platform "$PLATFORM" -f "$DOCKERFILE" \
              --build-arg BASE="$BASE" --build-arg RUST_VERSION="$RUST_VERSION" \
              --build-arg RUST_HOST="$TARGET" -t vector-native-arm .
          fi
      - name: Compile and run a Rust smoke test
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build-target || matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -e TARGET -e BUILD_TARGET vector-native-arm bash -euxo pipefail -c '
            if [[ "$TARGET" == arm-unknown-linux-gnueabi ]]; then
              trap '\''tail -100 /tmp/probe.strace'\'' EXIT
              timeout 90 strace -f -o /tmp/probe.strace rustc -vV
              printf "fn main() { println!(\"native ARM Rust works\"); }\n" >/tmp/probe.rs
              timeout 90 strace -f -o /tmp/probe.strace rustc --target "$BUILD_TARGET" /tmp/probe.rs -o /tmp/probe
            else
              timeout 90 rustc -vV
              printf "fn main() { println!(\"native ARM Rust works\"); }\n" >/tmp/probe.rs
              timeout 90 rustc --target "$BUILD_TARGET" /tmp/probe.rs -o /tmp/probe
            fi
            /tmp/probe
          '
      - name: Test native dependency patches
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build-target || matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work" \
            -e TARGET -e BUILD_TARGET -e CARGO_TARGET_DIR=/work/target/native-patches \
            vector-native-arm bash -euxo pipefail -c '
              if [[ "$TARGET" == *musl* ]]; then
                export RUSTFLAGS="-D warnings -C target-feature=+crt-static"
              fi
              cargo test --manifest-path lib/vendored/protoc-bin-vendored/Cargo.toml \
                --target "$BUILD_TARGET" --test protoc_override
              cargo test --manifest-path lib/vendored/quanta/Cargo.toml \
                --target "$BUILD_TARGET" --lib --no-default-features
            '
      - name: Link Vector with the release feature set
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build-target || matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work" \
            -e TARGET -e BUILD_TARGET -e CARGO_PROFILE_RELEASE_LTO=off \
            -e CARGO_BUILD_JOBS=4 vector-native-arm bash -euxo pipefail -c '
              # The 32-bit compiler and linker each have a 4 GiB address space.
              # First prove linking without LTO before testing release LTO.
              if [[ "$TARGET" == *musl* ]]; then
                export RUSTFLAGS="-D warnings -C target-feature=+crt-static"
              fi
              cargo build --locked --release --target "$BUILD_TARGET" \
                --no-default-features --features "target-$TARGET"
              file="target/$BUILD_TARGET/release/vector"
              readelf -h "$file"
              readelf -A "$file"
              readelf --version-info "$file"
              if [[ "$TARGET" == *musl* ]]; then
                if readelf -l "$file" | grep -q INTERP; then
                  echo "musl artifact must not have a dynamic interpreter" >&2
                  exit 1
                fi
                if readelf -d "$file" | grep -q NEEDED; then
                  echo "musl artifact must not have dynamic dependencies" >&2
                  exit 1
                fi
              fi
              "$file" --version
              if [[ "$BUILD_TARGET" != "$TARGET" ]]; then
                mkdir -p "target/$TARGET/release"
                cp "$file" "target/$TARGET/release/vector"
              fi
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vector
          if-no-files-found: error
