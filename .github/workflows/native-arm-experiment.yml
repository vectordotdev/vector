name: Native ARM build experiment

# Run /ci-run-native-arm in a review on this PR, not on every edit.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event.pull_request.number == 27197 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'thomasqueirozb' &&
      contains(fromJSON('["/ci-run-native-arm", "/ci-run-native-armv6", "/ci-run-native-armv7", "/ci-run-native-armv6-release", "/ci-run-native-armv7-release", "/ci-run-native-gnu-release"]'), github.event.review.body)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: plan
        with:
          script: |
            const debian = 'debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc';
            const targets = [
              {
                target: 'armv7-unknown-linux-gnueabihf', platform: 'linux/arm/v7',
                dockerfile: 'scripts/native/Dockerfile.arm-gnu',
                base: 'debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc',
              },
              {
                target: 'arm-unknown-linux-gnueabi', platform: 'linux/arm64',
                dockerfile: 'scripts/native/Dockerfile.arm-gnu',
                base: 'debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2',
              },
              {
                target: 'armv7-unknown-linux-musleabihf', platform: 'linux/arm/v7',
                dockerfile: 'scripts/native/Dockerfile.armv7-musl', base: 'unused',
                'build-target': 'armv7-alpine-linux-musleabihf',
              },
              {
                target: 'arm-unknown-linux-musleabi', platform: 'linux/arm64',
                dockerfile: 'scripts/native/Dockerfile.arm-musl', base: debian,
              },
            ];
            const command = context.payload.review.body;
            const selected = command.includes('native-gnu')
              ? targets.filter(t => t.target.endsWith('gnueabi') || t.target.endsWith('gnueabihf'))
              : command.includes('armv6')
                ? targets.filter(t => t.target.startsWith('arm-'))
              : command.includes('armv7')
                ? targets.filter(t => t.target.startsWith('armv7-'))
                : targets;
            core.setOutput('matrix', JSON.stringify(selected));

  arm:
    needs: plan
    name: Build native ${{ matrix.target }}
    runs-on: ubuntu-24.04-8core-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-armv6-runtime
        if: startsWith(matrix.target, 'arm-unknown-linux-')
      - name: Build native ARM toolchain
        if: ${{ !endsWith(github.event.review.body, '-release') }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BASE: ${{ matrix.base }}
        run: |
          if grep -l qemu /proc/sys/fs/binfmt_misc/* 2>/dev/null; then
            echo '::error::This test must not use QEMU'
            exit 1
          fi
          RUST_VERSION=$(awk -F '"' '/^channel/ { print $2 }' rust-toolchain.toml)
          RUST_HOST="$TARGET"
          if [[ "$TARGET" == arm-unknown-linux-* ]]; then
            RUST_HOST=aarch64-unknown-linux-gnu
          fi
          if [[ "$TARGET" == arm-unknown-linux-musleabi ]]; then
            docker build --pull --platform "$PLATFORM" -f scripts/native/Dockerfile.arm-gnu \
              --build-arg BASE="$BASE" --build-arg RUST_VERSION="$RUST_VERSION" \
              --build-arg RUST_HOST="$RUST_HOST" --build-arg RUST_TARGET="$TARGET" -t vector-native-arm-gnu .
            docker build --platform "$PLATFORM" -f "$DOCKERFILE" \
              --build-arg RUST_VERSION="$RUST_VERSION" -t vector-native-arm .
          else
            docker build --pull --platform "$PLATFORM" -f "$DOCKERFILE" \
              --build-arg BASE="$BASE" --build-arg RUST_VERSION="$RUST_VERSION" \
              --build-arg RUST_HOST="$RUST_HOST" --build-arg RUST_TARGET="$TARGET" -t vector-native-arm .
          fi
      - name: Compile and run a Rust smoke test
        if: ${{ !endsWith(github.event.review.body, '-release') }}
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build-target || matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -e TARGET -e BUILD_TARGET vector-native-arm bash -euxo pipefail -c '
            timeout 90 rustc -vV
            printf "fn main() { println!(\"native ARM Rust works\"); }\n" >/tmp/probe.rs
            linker=()
            case "$TARGET" in
              arm-unknown-linux-gnueabi) linker=(-C linker=arm-linux-gnueabi-gcc) ;;
              arm-unknown-linux-musleabi) linker=(-C linker=arm-linux-musleabi-gcc) ;;
            esac
            timeout 90 rustc --target "$BUILD_TARGET" "${linker[@]}" /tmp/probe.rs -o /tmp/probe
            timeout 90 /tmp/probe
          '
      - name: Test native dependency patches
        if: ${{ !endsWith(github.event.review.body, '-release') }}
        timeout-minutes: 10
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build-target || matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work" \
            -e TARGET -e BUILD_TARGET -e CARGO_TARGET_DIR=/work/target/native-patches \
            vector-native-arm bash -euxo pipefail -c '
              if [[ "$TARGET" == *musl* ]]; then
                export RUSTFLAGS="-D warnings -C target-feature=+crt-static"
              fi
              timeout 300 cargo test --manifest-path lib/vendored/protoc-bin-vendored/Cargo.toml \
                --target "$BUILD_TARGET" --test protoc_override
              timeout 300 cargo test --manifest-path lib/vendored/quanta/Cargo.toml \
                --target "$BUILD_TARGET" --lib --no-default-features -- --test-threads=1
            '
      - name: Install packaging tools
        if: endsWith(github.event.review.body, '-release')
        uses: ./.github/actions/setup
        with:
          rust: true
          mold: false
          cargo-deb: true
          cmark-gfm: true
          cross-binutils: true
          rpm: ${{ matrix.target == 'armv7-unknown-linux-gnueabihf' }}
      - name: Generate release test metadata
        if: endsWith(github.event.review.body, '-release')
        id: metadata
        env:
          CHANNEL: custom
        run: make ci-generate-publish-metadata
      - name: Test the production build and packaging action
        if: endsWith(github.event.review.body, '-release')
        uses: ./.github/actions/build-linux-native
        env:
          CHANNEL: custom
          VECTOR_VERSION: ${{ steps.metadata.outputs.vector_version }}
          VECTOR_BUILD_DESC: ${{ steps.metadata.outputs.vector_build_desc }}
        with:
          target: ${{ matrix.target }}
      - name: Verify the GNU artifact on an older runtime
        if: endsWith(github.event.review.body, '-release') && contains(matrix.target, 'gnueabi')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # This older image is a compatibility test, never a build environment.
          PLATFORM=linux/arm/v7
          if [[ "$TARGET" == arm-unknown-linux-gnueabi ]]; then
            PLATFORM=linux/arm/v6
          fi
          NAME="native-gnu-compat-$GITHUB_RUN_ID"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          ARGS=(--rm --name "$NAME" --platform "$PLATFORM"
            -v "$PWD/target/$TARGET/release/vector:/usr/local/bin/vector:ro"
            -v "$PWD/tests/data/native-release-smoke.yaml:/smoke.yaml:ro"
            --entrypoint /usr/local/bin/vector)
          timeout -k 10 90 docker run "${ARGS[@]}" debian:bullseye-slim --version
          printf 'native packaging works\n' | timeout -k 10 90 docker run -i "${ARGS[@]}" \
            debian:bullseye-slim --config /smoke.yaml > "$RUNNER_TEMP/gnu-compat.json"
          grep -F '"message":"NATIVE PACKAGING WORKS"' "$RUNNER_TEMP/gnu-compat.json"
      - name: Load Docker build results for runtime tests
        if: endsWith(github.event.review.body, '-release')
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test production Dockerfiles without a push
        if: endsWith(github.event.review.body, '-release')
        env:
          TARGET: ${{ matrix.target }}
          VECTOR_VERSION: ${{ steps.metadata.outputs.vector_version }}
          CHANNEL: test
          PUSH: "false"
          LOAD: "true"
          REPOS: vector-ci
        run: |
          export TAG="$VECTOR_VERSION"
          export PLATFORM=linux/arm/v7
          if [[ "$TARGET" == arm-unknown-linux-* ]]; then
            export PLATFORM=linux/arm/v6
          fi
          if [[ "$TARGET" == *musl* ]]; then
            bases=(alpine distroless-static)
          else
            bases=(debian distroless-libc)
          fi
          if [[ "$TARGET" == arm-unknown-linux-* ]]; then
            bases=("${bases[0]}")
          fi
          for BASE in "${bases[@]}"; do
            export BASE
            make release-docker
            timeout -k 10 90 docker run --rm --platform "$PLATFORM" "$REPOS:$TAG-$BASE" --version
            printf 'native packaging works\n' | timeout -k 10 90 docker run --rm -i --platform "$PLATFORM" \
              -v "$PWD/tests/data/native-release-smoke.yaml:/smoke.yaml:ro" \
              "$REPOS:$TAG-$BASE" --config /smoke.yaml > "$RUNNER_TEMP/native-smoke.json"
            grep -q '"message":"NATIVE PACKAGING WORKS"' "$RUNNER_TEMP/native-smoke.json"
          done
      - name: Link Vector with the release feature set
        if: ${{ !endsWith(github.event.review.body, '-release') }}
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build-target || matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/work" \
            -e TARGET -e BUILD_TARGET -e CARGO_PROFILE_RELEASE_LTO=off \
            -e CARGO_BUILD_JOBS=4 vector-native-arm bash -euxo pipefail -c '
              # The 32-bit compiler and linker each have a 4 GiB address space.
              # First prove linking without LTO before testing release LTO.
              if [[ "$TARGET" == *musl* ]]; then
                export RUSTFLAGS="-D warnings -C target-feature=+crt-static"
              fi
              cargo build --locked --release --target "$BUILD_TARGET" \
                --no-default-features --features "target-$TARGET"
              file="target/$BUILD_TARGET/release/vector"
              readelf -h "$file"
              readelf -A "$file"
              readelf --version-info "$file"
              if [[ "$TARGET" == *musl* ]]; then
                if readelf -l "$file" | grep -q INTERP; then
                  echo "musl artifact must not have a dynamic interpreter" >&2
                  exit 1
                fi
                if readelf -d "$file" | grep -q NEEDED; then
                  echo "musl artifact must not have dynamic dependencies" >&2
                  exit 1
                fi
              fi
              timeout 90 "$file" --version
              if [[ "$BUILD_TARGET" != "$TARGET" ]]; then
                mkdir -p "target/$TARGET/release"
                cp "$file" "target/$TARGET/release/vector"
              fi
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/vector
            target/artifacts/*
            target/${{ matrix.target }}-runtime.strace
          if-no-files-found: warn
