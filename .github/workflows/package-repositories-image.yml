name: Package Repository Image

on:
  workflow_dispatch:

permissions: {}

# Rebuild manually after publisher/dependency changes or to refresh OS packages.
# A successful build does not change the image selected for production jobs.
concurrency:
  group: package-repositories-image
  cancel-in-progress: false

jobs:
  # Build without package-signing or AWS credentials; publish only from master.
  build:
    if: github.repository_id == '146327667' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/vectordotdev/vector-package-publisher
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build, check and publish a private image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="orgs/vectordotdev/packages/container/${IMAGE_NAME##*/}"
          metadata="$RUNNER_TEMP/package-image.json"
          gh api "$package" > "$metadata" || jq -e '.status == "404"' "$metadata" >/dev/null
          jq -e '.status == "404" or .visibility == "private"' "$metadata" >/dev/null

          revision=$(git rev-parse HEAD)
          tag="$IMAGE_NAME:$revision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull --no-cache --tag "$tag" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --file distribution/repositories/Dockerfile .
          docker run --rm "$tag" --help
          docker run --rm --entrypoint sh "$tag" -ec \
            'for tool in vdev apt-ftparchive dpkg-deb createrepo_c rpm rpmsign gpg; do command -v "$tool"; done'

          # Registry credentials stay in memory; the new GHCR package is private by default.
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d /dev/shm/package-registry.XXXXXX)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$tag"
          test "$(gh api "$package" --jq .visibility)" = private
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          [[ "$image" == "$IMAGE_NAME@sha256:"* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Pull from GHCR on a fresh runner before showing the digest operators can select.
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package-repository-tools
        with:
          image: ${{ needs.build.outputs.image }}
          token: ${{ github.token }}
      - name: Check the pulled image and report the manual selection command
        env:
          PUBLISHER_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          docker run --rm vector-package-publisher:local --help
          "$VDEV" release repositories --help
          {
            echo 'Set the repository variable below to select this image for future publishing and maintenance runs.'
            echo '```sh'
            printf 'gh variable set PACKAGE_REPOSITORIES_IMAGE --repo %s --body %s\n' "$GITHUB_REPOSITORY" "$PUBLISHER_IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
