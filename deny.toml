[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "BlueOak-1.0.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib"
]

private = { ignore = true }

exceptions = [
    # MPL-2.0 are added case-by-case to make sure we are in compliance. To be in
    # compliance we cannot be modifying the source files.
    { allow = ["MPL-2.0"], name = "colored", version = "*" },
    { allow = ["MPL-2.0"], name = "vector-common-macros" },
    { allow = ["MPL-2.0"], name = "vector-config-common" },
    { allow = ["MPL-2.0"], name = "vector-config-macros" },
    { allow = ["MPL-2.0"], name = "vrl", version = "*" },
]

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa marvin attack - unpatched upstream (https://github.com/vectordotdev/vector/issues/19262)" },
  { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained (https://github.com/vectordotdev/vector/issues/24940)" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained with no patched release; used by serde_yaml and VRL's serde_yaml_ng, whose backend migration is pending upstream (https://github.com/acatton/serde-yaml-ng/issues/5)" },
  { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 is vulnerable but unmaintained; upgrading vector-buffers to rkyv 0.8 requires a breaking serialization migration" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via elliptic-curve 0.13, p256/p384 0.13, and openidconnect 4 (pulsar auth-oauth2), which only uses openidconnect for provider discovery; unblocked when openidconnect moves to p256/p384 0.14 (https://github.com/ramosbugs/openidconnect-rs/pull/244)" },
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via pulsar and arrow-ipc 58, neither of which call the affected stream::raw with_context constructors. Fixed only in zstd 0.14, which Vector itself uses" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 via zstd 0.13 (same dependents as RUSTSEC-2026-0391), which only decompress through stream::read::Decoder, decode_all, and bulk, which the advisory lists as unaffected. Fixed only in zstd-safe 8" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained with no safe upgrade - transitive dep via heim (unmaintained) and wasmtimer (https://github.com/whizsid/wasmtimer-rs/pull/32)" },
  { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained because it wraps chrono (RUSTSEC-2026-0543); used directly and widely transitively with no maintained drop-in replacement yet" },
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; used pervasively by Vector, VRL, and many dependencies, so migrating to jiff or time is a large effort" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained alongside chrono (RUSTSEC-2026-0543); migrates together with chrono" },
]
