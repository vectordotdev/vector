version: 1
applications:
  - appRoot: website
    frontend:
      phases:
        preBuild:
          commands:
            - source "${NVM_DIR}/nvm.sh"
            - nvm use 24.11.0
            - node --version
        build:
          - |
            if [[ "${AWS_BRANCH}" == "website" ]]; then
              make ci-production-build
            else
              make ci-preview-build
            fi
      artifacts:
        baseDirectory: public
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
