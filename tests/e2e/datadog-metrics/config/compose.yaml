version: "3"

services:
  # Emits metrics to the Agent
  dogstatsd-client:
    build: ../dogstatsd_client
    environment:
      - STATSD_HOST=datadog-agent
    depends_on:
      - datadog-agent

  # Receives DogStatsD metrics and forwards them to two destinations:
  #   1. fakeintake-agent directly (dd_url) — the baseline
  #   2. vector (additional_endpoints) — which then forwards to fakeintake-vector
  # Using a single agent ensures both paths see the same computed values
  # (same flush window, identical histogram statistics).
  datadog-agent:
    image: docker.io/datadog/agent:${CONFIG_AGENT_VERSION}
    depends_on:
      - fakeintake-agent
      - vector
    environment:
      - DD_API_KEY=${TEST_DATADOG_API_KEY:?TEST_DATADOG_API_KEY required}
      - DD_HOSTNAME=datadog-agent
    volumes:
      # The Agent config file
      - ../data/agent.yaml:/etc/datadog-agent/datadog.yaml

  # Receives metric data from the `datadog-agent` via additional_endpoints and sends
  # to the `fakeintake-vector` service.
  vector:
    depends_on:
      - fakeintake-vector
    # re-using the integration test runner image since it already has
    # compiled vector on it.
    image: ${CONFIG_VECTOR_IMAGE}
    environment:
      - FEATURES=e2e-tests-datadog
      # Read by envsubst (below) to render the config template; Vector's own
      # env-var interpolation stays disabled.
      - CONFIG_SERIES_API_VERSION
    working_dir: /home/vector
    command:
      - "sh"
      - "-c"
      # Render the config template with envsubst ($${...} escapes docker-compose
      # interpolation so the literal ${...} reaches the container), then run
      # Vector against the rendered file.
      - "envsubst '$${CONFIG_SERIES_API_VERSION}' < /home/vector/tests/e2e/datadog-metrics/data/vector.yaml > /tmp/vector.yaml && exec /usr/bin/vector -vvv -c /tmp/vector.yaml"
    volumes:
      - ../../../..:/home/vector

  # Receives metric data from the `datadog-agent` directly. Is queried by the test runner
  # which does the validation of consistency with the other fakeintake service.
  fakeintake-agent:
    # Pinned by digest rather than a floating tag. This build decodes the V3 columnar
    # series intake (`/api/intake/metrics/v3/series`) into the same JSON shape it returns
    # for V2, which the `v3` leg of the `series_api_version` matrix relies on. The previous
    # `v77a06f2b` pin doesn't know that route at all: it rejects the payloads and answers
    # `{"errors":["invalid route parameter"]}` when queried for them.
    image: docker.io/datadog/fakeintake@sha256:bd5f58f1fdd7b45f25fd4b8c522b6705b0f805c1d0651e43cc3bcfdb1354334c

  # Receives metric data from the `vector` service. Is queried by the test runner
  # which does the validation of consistency with the other fakeintake service.
  fakeintake-vector:
    # Must stay in lockstep with `fakeintake-agent` above: the test compares the payloads
    # both services received, so they have to decode them identically.
    image: docker.io/datadog/fakeintake@sha256:bd5f58f1fdd7b45f25fd4b8c522b6705b0f805c1d0651e43cc3bcfdb1354334c

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true

volumes:
  target: {}
