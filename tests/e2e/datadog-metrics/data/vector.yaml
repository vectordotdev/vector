data_dir: "/tmp/"

sources:
  agent:
    type: "datadog_agent"
    address: "0.0.0.0:8181"
    multiple_outputs: true
    enabled_data_types: ["metrics"]
    store_api_key: false

sinks:
  dd:
    inputs:
      - "agent.metrics"
    type: "datadog_metrics"
    default_api_key: "unused"
    endpoint: "http://fakeintake-vector:80"
    batch:
      timeout_secs: 1
    series_api_version: "${CONFIG_SERIES_API_VERSION}"
