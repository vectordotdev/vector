features:
  - e2e-tests-datadog
  - typed-trace

test: e2e
test_filter: "datadog::traces::"

runner:
  env:
    FAKE_INTAKE_AGENT_ENDPOINT: "http://fakeintake-agent:80"
    FAKE_INTAKE_VECTOR_ENDPOINT: "http://fakeintake-vector:80"
  volumes:
    datadog_traces_evidence: /output/datadog-traces

matrix:
  agent_version: ["7.84.6"]

# Stop the pipeline in dependency order so both fakeintakes hold complete captures: each
# tracer flushes on stop, then the Agent flushes to both endpoints, then Vector drains its sink.
lifecycle:
  before_validation:
    - wait_for_success: { service: client, timeout_secs: 120 }
    - stop:
        labels: [vector.datadog-traces.producer=true]
        timeout_secs: 30
    - stop:
        services: [datadog-agent]
        timeout_secs: 30
    - stop:
        services: [vector]
        # Longer than Vector's default 60-second graceful shutdown limit.
        timeout_secs: 90
        # Vector exits 0 even when graceful shutdown times out.
        reject_log_messages: ["Failed to gracefully shut down in time"]

# changes to these files/paths will invoke the e2e test in CI
# expressions are evaluated using https://github.com/micromatch/picomatch
paths:
  - "src/common/datadog.rs"
  - "src/sources/datadog_agent/**"
  - "src/internal_events/datadog_*"
  - "src/sinks/datadog/traces/**"
  - "src/sinks/util/**"
  - "lib/datadog-proto/**"
  - "lib/vector-core/src/event/trace.rs"
  - "lib/vector-core/src/event/typed_trace/**"
  - "tests/e2e/datadog/mod.rs"
  - "tests/e2e/datadog/traces/**"
  - "tests/e2e/datadog-traces/**"
