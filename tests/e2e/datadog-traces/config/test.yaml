features:
  - e2e-tests-datadog
  - typed-trace

test: e2e
test_filter: "datadog::traces::"

runner:
  env:
    FAKE_INTAKE_AGENT_ENDPOINT: "http://fakeintake-agent:80"
    FAKE_INTAKE_VECTOR_ENDPOINT: "http://fakeintake-vector:80"
  volumes:
    datadog_traces_evidence: /output/datadog-traces

matrix:
  agent_version: ["7.84.6"]

# Intentionally absent from the automatic CI matrices and changed-file filters for now.
