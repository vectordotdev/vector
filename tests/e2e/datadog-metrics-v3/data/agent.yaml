api_key: DEADBEEF
log_level: "warn"

# disable bunch of stuff we don't need
inventories_configuration_enabled: false
enable_gohai: false
cloud_provider_metadata: []

apm_config:
  enabled: false

process_config:
  container_collection:
    enabled: false
  process_discovery:
    enabled: false
  disable_realtime_checks: true

logs_enabled: false

# configure dogstatsd
use_dogstatsd: true
dogstatsd_non_local_traffic: true

# Send metrics directly to fakeintake-agent as the V3 baseline, and also forward the same
# payloads to Vector (which re-encodes to V3 on its way to fakeintake-vector) so both paths see
# identical computed values (same flush window, same histogram statistics) — same trick the
# V1/V2 suite uses.
dd_url: http://fakeintake-agent:80
additional_endpoints:
  "http://vector:8181":
    - DEADBEEF

# Unlike the V1/V2 suite's agent.yaml, this one diverges: the Agent picks one series wire
# format per destination (not globally), so fakeintake-agent gets real V3 (the baseline we're
# after) while Vector gets V2 (the only ingestion format its datadog_agent source supports).
use_v3_api:
  series:
    endpoints:
      "http://fakeintake-agent:80": "true"
      "http://vector:8181": "false"
