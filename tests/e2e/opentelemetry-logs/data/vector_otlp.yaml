# The E2E tests read component_received_events_total from the observability API.
api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  source0:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318
      keepalive:
        max_connection_age_jitter_factor: 0.1
        max_connection_age_secs: 300
    decoding:
      codec: otlp

sinks:
  otel_sink:
    inputs:
      - source0.logs
    type: opentelemetry
    protocol:
      type: http
      uri: http://otel-collector-sink:5318/v1/logs
      encoding:
        codec: otlp

  otel_file_sink:
    type: file
    path: "/output/opentelemetry-logs/vector-file-sink.log"
    inputs:
      - source0.logs
    encoding:
      codec: json
