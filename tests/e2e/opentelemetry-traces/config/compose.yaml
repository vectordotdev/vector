name: opentelemetry-vector-e2e
services:
  prepare-output:
    image: alpine:3.20
    command: ["/bin/sh", "-c", "rm -rf /output/opentelemetry-traces && mkdir -p /output/opentelemetry-traces"]
    volumes:
      - type: volume
        source: vector_target
        target: /output

  otel-collector-source:
    container_name: otel-collector-source
    image: otel/opentelemetry-collector-contrib:${CONFIG_COLLECTOR_VERSION}
    init: true
    depends_on:
      prepare-output:
        condition: service_completed_successfully
    user: "0:0" # test only, override special user with root
    volumes:
      - type: bind
        source: ../data/collector-source.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - type: volume
        source: vector_target
        target: /output
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  traces-generator:
    container_name: traces-generator
    build:
      context: ../../../..
      dockerfile: ./tests/e2e/opentelemetry-common/telemetrygen.Dockerfile
    init: true
    depends_on:
      otel-collector-source:
        condition: service_started
      vector:
        condition: service_started
      otel-collector-sink:
        condition: service_started
    command:
      - "-c"
      - |
        until nc -z otel-collector-source 4318; do
          sleep 0.5
        done
        telemetrygen traces \
          --otlp-endpoint=otel-collector-source:4318 \
          --otlp-insecure \
          --otlp-http \
          --traces=100 \
          --rate=0

  otel-collector-sink:
    container_name: otel-collector-sink
    build:
      context: ../../../..
      dockerfile: ./tests/e2e/opentelemetry-common/collector.Dockerfile
      args:
        CONFIG_COLLECTOR_VERSION: ${CONFIG_COLLECTOR_VERSION}
    init: true
    depends_on:
      prepare-output:
        condition: service_completed_successfully
    user: "0:0" # test only, override special user with root
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    volumes:
      - type: bind
        source: ../data/collector-sink.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - type: volume
        source: vector_target
        target: /output

  vector:
    container_name: vector-otel-traces-e2e
    image: ${CONFIG_VECTOR_IMAGE}
    init: true
    depends_on:
      prepare-output:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ../data/vector_otlp.yaml
        target: /etc/vector/vector.yaml
        read_only: true
      - type: volume
        source: vector_target
        target: /output
    environment:
      - VECTOR_LOG=${VECTOR_LOG:-info}
      - FEATURES=e2e-tests-opentelemetry
    command: ["vector", "-c", "/etc/vector/vector.yaml"]

volumes:
  vector_target:
    external: true

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true
