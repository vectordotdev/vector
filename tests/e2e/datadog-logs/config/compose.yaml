version: "3.8"

# Healthcheck for both fakeintakes: passes once the intake holds every log event that
# `log_generator` writes. It's a lower bound: the Rust test asserts the exact count, so
# duplicates fail there instead of stalling this check. `"hostname"` appears once per event.
x-logs-received: &logs-received
  test:
    - CMD-SHELL
    - >-
      found=$$(curl -s 'http://localhost:80/fakeintake/payloads?endpoint=/api/v2/logs&format=json'
      | grep -o '"hostname"' | wc -l);
      echo "logs=$$found/1000";
      [ "$$found" -ge 1000 ]
  interval: 500ms
  timeout: 2s
  retries: 240

services:
  # Generates random log data for consumption by the custom Agent check
  log_generator:
    image: docker.io/mingrammer/flog
    depends_on:
      - datadog-agent-vector
      - datadog-agent
    command:
      - "-f"
      - "json"
      # Keep in sync with the fakeintake healthcheck and `EXPECTED_LOG_EVENTS` in test.yaml.
      - "-n"
      - "1000"
      - "-t"
      - "log"
      - "-o"
      - "/var/log/a_custom.log"
    volumes:
      - type: volume
        source: log_path
        target: /var/log/

  # Tails a custom log created by `log_generator` and sends log data to
  # the `fakeintake-agent` service
  datadog-agent:
    image: docker.io/datadog/agent:${CONFIG_AGENT_VERSION}
    depends_on:
      - fakeintake-agent
    environment:
      - DD_API_KEY=${TEST_DATADOG_API_KEY:?TEST_DATADOG_API_KEY required}
      - DD_HOSTNAME=datadog-agent
      - DD_ENABLE_PAYLOADS_EVENTS=false
      - DD_ENABLE_PAYLOADS_SERVICE_CHECKS=false
      - DD_CONTAINER_EXCLUDE="name:.*"
    volumes:
      # The Agent config file
      - type: bind
        source: ../data/agent_only.yaml
        target: /etc/datadog-agent/datadog.yaml
        read_only: true

      # The custom logs check
      - type: bind
        source: ../data/logs.conf.d
        target: /conf.d
        read_only: true

      # The custom log to tail, created by the `log_generator` service
      - type: volume
        source: log_path
        target: /var/log/

  # Tails a custom log created by `log_generator` and sends log data to
  # the `vector` service
  datadog-agent-vector:
    image: docker.io/datadog/agent:${CONFIG_AGENT_VERSION}
    depends_on:
      - vector
    environment:
      - DD_API_KEY=${TEST_DATADOG_API_KEY:?TEST_DATADOG_API_KEY required}
      - DD_HOSTNAME=datadog-agent-vector
      - DD_ENABLE_PAYLOADS_EVENTS=false
      - DD_ENABLE_PAYLOADS_SERVICE_CHECKS=false
      - DD_CONTAINER_EXCLUDE="name:.*"
    volumes:
      # The Agent config file
      - type: bind
        source: ../data/agent_vector.yaml
        target: /etc/datadog-agent/datadog.yaml
        read_only: true

      # The custom logs check
      - type: bind
        source: ../data/logs.conf.d
        target: /conf.d
        read_only: true

      # The custom log to tail, created by the `log_generator` service
      - type: volume
        source: log_path
        target: /var/log/

  # Receives log data from the `datadog-agent-vector` service and sends
  # to the `fakeintake-vector` service.
  vector:
    depends_on:
      - fakeintake-vector
    # re-using the integration test runner image since it already has
    # compiled vector on it.
    image: ${CONFIG_VECTOR_IMAGE}
    environment:
      - FEATURES=e2e-tests-datadog
    working_dir: /home/vector
    command:
      - "/usr/bin/vector"
      - "-vvv"
      - "-c"
      - "/home/vector/tests/e2e/datadog-logs/data/vector.yaml"
    volumes:
      - type: bind
        source: ../../../..
        target: /home/vector

  # Receives log data from the `datadog-agent` service. Is queried by the test runner
  # which does the validation of consistency with the other fakeintake service.
  fakeintake-agent:
    # TODO: temporarily pegging the image as latest results in failures
    image: docker.io/datadog/fakeintake:v3c2ea716
    healthcheck: *logs-received

  # Receives log data from the `datadog-agent-vector` service. Is queried by the test runner
  # which does the validation of consistency with the other fakeintake service.
  fakeintake-vector:
    # TODO: temporarily pegging the image as latest results in failures
    image: docker.io/datadog/fakeintake:v3c2ea716
    healthcheck: *logs-received

  # A detached `compose up` waits for all dependency conditions before starting this service.
  # This keeps the test runner behind the generator finishing and both intakes holding every
  # log event.
  logs-ready:
    image: alpine:3.20
    depends_on:
      log_generator:
        condition: service_completed_successfully
      fakeintake-agent:
        condition: service_healthy
      fakeintake-vector:
        condition: service_healthy
    command: ["true"]

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true

volumes:
  log_path: {}
  target: {}
