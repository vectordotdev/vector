features:
  - e2e-tests-opentelemetry

test: e2e
test_filter: "opentelemetry::multiservice_traces::"

runner:
  needs_docker_socket: true
  volumes:
    opentelemetry_traces_multiservice_evidence: /output/opentelemetry-traces-multiservice

matrix:
  collector_version: ["0.159.0"]
  ingress_exporter: ["otlphttp", "otlp"] # HTTP and gRPC into Vector, respectively.


# Intentionally absent from the automatic CI matrices and changed-file filters.
