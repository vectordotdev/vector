# prepare-demo.sh downloads the pinned upstream files before vdev starts.
include:
  - path:
      - upstream/compose.yaml
      - upstream/compose.full.yaml
      - demo-overrides.yaml
    project_directory: .
    env_file:
      - upstream/.env
      - demo.env
services:
  prepare-output:
    image: alpine:3.20
    command:
      - sh
      - "-c"
      - rm -rf /output/opentelemetry-traces-multiservice/${CONFIG_INGRESS_EXPORTER}
        && mkdir -p /output/opentelemetry-traces-multiservice/${CONFIG_INGRESS_EXPORTER}
    volumes:
      - opentelemetry_traces_multiservice_evidence:/output/opentelemetry-traces-multiservice
  otel-collector-sink:
    build:
      context: "../../../.."
      dockerfile: tests/e2e/opentelemetry-common/collector.Dockerfile
      args:
        CONFIG_COLLECTOR_VERSION: "${CONFIG_COLLECTOR_VERSION}"
    environment:
      - CONFIG_INGRESS_EXPORTER=${CONFIG_INGRESS_EXPORTER}
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    depends_on:
      prepare-output:
        condition: service_completed_successfully
    volumes:
      - "../data/collector-sink.yaml:/etc/otelcol-contrib/config.yaml:ro"
      - opentelemetry_traces_multiservice_evidence:/output/opentelemetry-traces-multiservice
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:13133/
      interval: 1s
      timeout: 1s
      retries: 120
  vector:
    image: "${CONFIG_VECTOR_IMAGE}"
    command:
      - vector
      - "--config"
      - "/etc/vector/vector.yaml"
    environment:
      - VECTOR_LOG=${VECTOR_LOG:-info}
    depends_on:
      prepare-output:
        condition: service_completed_successfully
      otel-collector-sink:
        condition: service_healthy
    volumes:
      - "../data/vector.yaml:/etc/vector/vector.yaml:ro"
  finalize-captures:
    # Reuse the demo's pinned Python runtime without starting Locust.
    image: ghcr.io/open-telemetry/demo:3.1.0-load-generator
    entrypoint:
      - python
      - "/usr/src/app/finalize.py"
    environment:
      - CONFIG_INGRESS_EXPORTER=${CONFIG_INGRESS_EXPORTER}
      - VECTOR_NETWORK=${VECTOR_NETWORK}
    depends_on:
      load-generator:
        condition: service_completed_successfully
    volumes:
      - "../data/finalize.py:/usr/src/app/finalize.py:ro"
      - "${DOCKER_SOCKET}:/var/run/docker.sock"
      - opentelemetry_traces_multiservice_evidence:/output/opentelemetry-traces-multiservice
  # Wait for finalized captures and stay running so vdev does not restart the workload.
  demo-ready:
    image: alpine:3.20
    command:
      - sh
      - "-c"
      - test -f /output/opentelemetry-traces-multiservice/${CONFIG_INGRESS_EXPORTER}/capture-complete && exec sleep infinity
    depends_on:
      finalize-captures:
        condition: service_completed_successfully
    volumes:
      - opentelemetry_traces_multiservice_evidence:/output/opentelemetry-traces-multiservice
volumes:
  opentelemetry_traces_multiservice_evidence:
    external: true
