data_dir: /var/lib/vector

sources:
  in:
    type: http_server
    address: 0.0.0.0:8080
    decoding:
      codec: json
    # A source 2xx is not a durability claim in this scenario. The current e2e
    # acknowledgement boundary is not tied to the disk buffer's fsync.
    acknowledgements:
      enabled: false

  metrics:
    type: internal_metrics
    scrape_interval_secs: 1

sinks:
  out:
    type: http
    inputs: [in]
    uri: http://oracle:8686/ingest
    method: post
    encoding:
      codec: json
    # Preserve one event per disk record so the payload classes exercise record
    # boundaries rather than accidental batching boundaries.
    batch:
      max_events: 1
    buffer:
      type: disk
      max_size: 8388608 # 8MiB: four Antithesis-sized data files
      when_full: block
    acknowledgements:
      enabled: false
    request:
      # Retry gated requests promptly when the terminal checker reopens the
      # oracle. This caps retry backoff; it does not expire the request.
      timeout_secs: 5
      retry_max_duration_secs: 1

  prom:
    type: prometheus_exporter
    inputs: [metrics]
    address: 0.0.0.0:9598
