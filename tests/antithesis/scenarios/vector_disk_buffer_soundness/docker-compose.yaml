name: vector-disk-buffer-soundness

x-vector-build: &vector-build
  context: ../../../..
  dockerfile: tests/antithesis/Dockerfile
  target: vector
  args:
    SCENARIO: vector_disk_buffer_soundness

x-workload-build: &workload-build
  context: ../../../..
  dockerfile: tests/antithesis/Dockerfile
  target: workload

x-node-health: &node-health
  test: ["CMD", "curl", "-fsS", "http://localhost:9598/metrics"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  vector:
    container_name: vector
    hostname: vector
    platform: linux/amd64
    init: true
    build: *vector-build
    image: vdbs-vector:${ANTITHESIS_IMAGE_TAG:-dev}
    entrypoint: ["/usr/bin/vector", "--config", "/etc/vector/vector.yaml"]
    environment:
      NO_COLOR: "1"
      # The pressure gate deliberately generates retries; suppress their expected
      # warnings without hiding other informational Vector logs.
      VECTOR_LOG: "info,vector::sinks::util::retries=error"
      # Antithesis-only tuning: small files force frequent rollover and make an
      # 8MiB public buffer consist of four files.
      VECTOR_DISK_V2_MAX_DATA_FILE_SIZE: "2097152"
    volumes: ["vdbs-buffer:/var/lib/vector"]
    healthcheck: *node-health

  oracle:
    container_name: oracle
    hostname: oracle
    platform: linux/amd64
    init: true
    build: *workload-build
    image: vdbs-oracle:${ANTITHESIS_IMAGE_TAG:-dev}
    entrypoint: ["/usr/bin/disk_soundness_oracle"]
    environment:
      NO_COLOR: "1"
      SCENARIO_NAME: "vector_disk_buffer_soundness"
      VECTOR_METRICS_URL: "http://vector:9598/metrics"
    depends_on:
      vector: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8686/report"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Test commands run separately from the oracle. This gives ingress
  # (workload -> vector) and egress (vector -> oracle) independent network
  # paths, so Antithesis can keep filling the buffer while the sink is cut off.
  workload:
    container_name: workload
    hostname: workload
    platform: linux/amd64
    init: true
    build: *workload-build
    image: vdbs-workload:${ANTITHESIS_IMAGE_TAG:-dev}
    entrypoint: ["sleep", "infinity"]
    environment:
      NO_COLOR: "1"
      VECTOR_SOURCE_URL: "http://vector:8080/"
      VECTOR_METRICS_URL: "http://vector:9598/metrics"
      ORACLE_URL: "http://oracle:8686"
    # The corruption driver needs write access to modify the active data file in place.
    # Other workload commands only inspect this mount.
    volumes: ["vdbs-buffer:/var/lib/vector"]
    depends_on:
      vector: { condition: service_healthy }
      oracle: { condition: service_healthy }

volumes:
  vdbs-buffer:
