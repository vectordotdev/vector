params:
  requests: 1000
  delay: 0.100
  rate:
    limit: 100
    action: "defer"

# With a constant time link that gives deferrals over a certain rate,
# the limiter will ramp up to a little over that request rate and then
# drop down repeatedly.

stats:
  in_flight:
    max: [16, 34]
    mean: [6.0, 9.0]
  rate:
    max: [90, 140]
    mean: [25, 78]

controller:
  in_flight:
    max: [16, 36]
    mean: [8.0, 26]
  concurrency_limit:
    max: [16, 36]
    mean: [8.0, 26]
  observed_rtt:
    min: [0.100, 0.102]
    max: [0.100, 0.102]
    mean: [0.100, 0.102]
  averaged_rtt:
    min: [0.100, 0.102]
    max: [0.100, 0.102]
    mean: [0.100, 0.102]
