params:
  requests: 500
  delay: 0.100
  concurrency_limit_params:
    limit: 5
    action: "drop"

stats:
  in_flight:
    max: [4, 5]
    mean: [1.8, 4.0]
    mode: [1, 5]
  rate:
    max: [45, 56]
    mean: [15, 32]

# Since our internal framework doesn't track the dropped requests, the
# values won't be representative of the actual number of requests in
# flight.

controller:
  in_flight:
    max: [13, 15]
    mean: [7.0, 8.0]
    mode: [3, 11]
  concurrency_limit:
    max: [10, 15]
    mean: [7.0, 8.0]
    mode: [8, 12]
  observed_rtt:
    min: [0.100, 0.102]
    max: [0.100, 0.102]
    mean: [0.100, 0.102]
  averaged_rtt:
    min: [0.100, 0.102]
    max: [0.100, 0.102]
    mean: [0.100, 0.102]
