params:
  requests: 500
  delay: 0.100
  concurrency_limit_params:
    limit: 5
    action: "defer"

# With a constant time link that gives deferrals over a certain
# concurrency, the limiter will ramp up to that concurrency and then
# drop down repeatedly. Note that, due to the timing of the adjustment,
# this may actually occasionally go over the error limit above, but it
# will be rare.
stats:
  in_flight:
    max: [5, 13]
    mode: [0, 5]
    mean: [2.4, 5.0]
  rate:
    max: [40, 52]
    mean: [20, 44]

controller:
  in_flight:
    max: [5, 18]
    mode: [4, 13]
    mean: [3.5, 12]
  concurrency_limit:
    max: [6, 18]
    mode: [2, 13]
    mean: [4.0, 12]
  observed_rtt:
    min: [0.100, 0.102]
    max: [0.100, 0.102]
    mean: [0.100, 0.102]
  averaged_rtt:
    min: [0.100, 0.102]
    max: [0.100, 0.102]
    mean: [0.100, 0.102]
