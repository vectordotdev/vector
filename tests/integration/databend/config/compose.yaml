version: "3"

services:
  rustfs:
    image: docker.io/rustfs/rustfs@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    # CI creates this bind mount as the runner user, so RustFS's UID 10001 cannot write it.
    user: root
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_CONSOLE_ENABLE=false
    volumes:
      - ../data/miniodat/:/data
  databend:
    image: docker.io/datafuselabs/databend:${CONFIG_VERSION}
    environment:
      - QUERY_DEFAULT_USER=vector
      - QUERY_DEFAULT_PASSWORD=vector
      - QUERY_STORAGE_TYPE=s3
      - AWS_S3_ENDPOINT=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - rustfs
    healthcheck:
      test: "curl -f localhost:8080/v1/health || exit 1"

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true
