version: "3"

services:
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:${CONFIG_VERSION}
  # Receives what `vmagent` writes, to compare with what the sink writes to `victoriametrics`.
  victoriametrics-reference:
    image: docker.io/victoriametrics/victoria-metrics:${CONFIG_VERSION}
  vmagent:
    image: docker.io/victoriametrics/vmagent:${CONFIG_VERSION}
    command:
      - -remoteWrite.url=http://victoriametrics-reference:8428/api/v1/write
      - -remoteWrite.flushInterval=1s
      - -remoteWrite.tmpDataPath=/tmp/vmagent
    depends_on:
      - victoriametrics-reference
  vmstorage:
    image: docker.io/victoriametrics/vmstorage:${CONFIG_VERSION}-cluster
  vminsert:
    image: docker.io/victoriametrics/vminsert:${CONFIG_VERSION}-cluster
    command:
      - -storageNode=vmstorage:8400
    depends_on:
      - vmstorage
  vmselect:
    image: docker.io/victoriametrics/vmselect:${CONFIG_VERSION}-cluster
    command:
      - -storageNode=vmstorage:8401
    depends_on:
      - vmstorage
  vmauth:
    image: docker.io/victoriametrics/vmauth:${CONFIG_VERSION}
    command:
      - -auth.config=/etc/vmauth/auth.yaml
    volumes:
      - ../data/vmauth.yaml:/etc/vmauth/auth.yaml:ro
    depends_on:
      - vminsert

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true
