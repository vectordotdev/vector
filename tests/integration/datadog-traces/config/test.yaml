features:
  - datadog-traces-integration-tests

test_filter: "::datadog::traces::"

env:
  AGENT_PORT: "8082"
  VECTOR_LOG: ${VECTOR_LOG}
  TRACE_AGENT_TO_VECTOR_URL: http://datadog-trace-agent-to-vector:8126/v0.3/traces
  TRACE_AGENT_URL: http://datadog-trace-agent:8126/v0.3/traces
  VECTOR_PORT: "8081"
  TEST_DATADOG_API_KEY:

matrix:
  # Pin to 7.83.3 because Agent 7.84.0 enables indexed trace payloads by default,
  # which the datadog_agent source does not yet support. Re-add an unpinned
  # version once indexed trace payload support lands.
  version: ["7.83.3"]

# changes to these files/paths will invoke the integration test in CI
# expressions are evaluated using https://github.com/micromatch/picomatch
paths:
  - "src/common/datadog.rs"
  - "src/internal_events/datadog_*"
  - "src/sinks/datadog/traces/**"
  - "src/sinks/util/**"
  - "tests/integration/datadog-traces/**"
