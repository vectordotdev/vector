features:
  - es-integration-tests

test_filter: "::elasticsearch::integration_tests::"

env:
  AWS_ACCESS_KEY_ID: dummy
  AWS_SECRET_ACCESS_KEY: dummy
  ELASTICSEARCH_AWS_ADDRESS: http://opensearch:9200
  ELASTICSEARCH_API_VERSION: v7
  ELASTICSEARCH_HTTP_ADDRESS: http://opensearch:9200
  ELASTICSEARCH_HTTPS_ADDRESS: https://opensearch-secure:9201
  ELASTICSEARCH_PASSWORD: Vector2026!
  ELASTICSEARCH_USERNAME: admin

matrix:
  version: [3.6.0]

# changes to these files/paths will invoke the integration test in CI
# expressions are evaluated using https://github.com/micromatch/picomatch
paths:
  - "src/sinks/elasticsearch/**"
  - "src/sinks/util/**"
  - "tests/data/ca/**"
  - "tests/integration/opensearch/**"
