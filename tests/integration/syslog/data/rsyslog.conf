module(load="imudp")
module(load="imtcp")

# Write the fields rsyslog parsed out of each message as one JSON object per
# line, so tests verify that the receiver understood the message rather than
# just that the bytes arrived. For RFC 3164 input, rsyslog derives app-name and
# procid from the TAG.
template(name="ParsedSyslogMessage" type="list") {
    constant(value="{\"facility\":\"")
    property(name="syslogfacility")
    constant(value="\",\"severity\":\"")
    property(name="syslogseverity")
    constant(value="\",\"hostname\":\"")
    property(name="hostname" format="json")
    constant(value="\",\"app_name\":\"")
    property(name="app-name" format="json")
    constant(value="\",\"proc_id\":\"")
    property(name="procid" format="json")
    constant(value="\",\"msg_id\":\"")
    property(name="msgid" format="json")
    constant(value="\",\"structured_data\":\"")
    property(name="structured-data" format="json")
    constant(value="\",\"message\":\"")
    property(name="msg" format="json")
    constant(value="\",\"raw\":\"")
    property(name="rawmsg" format="json")
    constant(value="\"}\n")
}

input(type="imudp" port="5514" ruleset="udp")
input(type="imtcp" port="5515" ruleset="tcp_line" supportOctetCountedFraming="off")
input(type="imtcp" port="5516" ruleset="tcp_octet" supportOctetCountedFraming="on")

ruleset(name="udp") {
    action(type="omfile" file="/var/log/vector-test/udp.log" template="ParsedSyslogMessage")
}

ruleset(name="tcp_line") {
    action(type="omfile" file="/var/log/vector-test/tcp-line.log" template="ParsedSyslogMessage")
}

ruleset(name="tcp_octet") {
    action(type="omfile" file="/var/log/vector-test/tcp-octet.log" template="ParsedSyslogMessage")
}
