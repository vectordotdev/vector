features:
  - aws-integration-tests

test_filter: ::aws_

runner:
  volumes:
    aws_aws-emulator-credentials: /run/aws-emulator

env:
  # Written by the emulator at startup; see tests/integration/aws/data/entrypoint.sh.
  AWS_SHARED_CREDENTIALS_FILE: /run/aws-emulator/9297/emulator_credentials
  CLOUDWATCH_ADDRESS: http://mock-aws:4566
  EC2_METADATA_ADDRESS: http://mock-ec2-metadata:1338
  ECS_ADDRESS: http://mock-ecs
  KINESIS_ADDRESS: http://mock-aws:4566
  KMS_ADDRESS: http://mock-aws:4566
  S3_ADDRESS: http://mock-aws:4566
  SQS_ADDRESS: http://mock-aws:4566
  SNS_ADDRESS: http://mock-aws:4566

matrix:
  version: [latest]

# changes to these files/paths will invoke the integration test in CI
# expressions are evaluated using https://github.com/micromatch/picomatch
paths:
  - "src/aws/**"
  - "src/internal_events/aws_*"
  - "src/sources/aws_*/**"
  - "src/sources/util/**"
  - "src/sinks/aws_*/**"
  - "src/sinks/util/**"
  - "src/transforms/aws_*"
  - "tests/integration/aws/**"
