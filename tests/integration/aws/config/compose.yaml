version: "3"

services:
  mock-ec2-metadata:
    image: public.ecr.aws/aws-ec2/amazon-ec2-metadata-mock:v1.13.0
  mock-aws:
    build: ../data
    # vdev runs `up` without `--build`; rebuild so Dockerfile edits are not ignored.
    pull_policy: build
    volumes:
      - aws-emulator-credentials:/home/emulator/.aws/emulator
  mock-ecs:
    image: docker.io/amazon/amazon-ecs-local-container-endpoints:latest
    environment:
      # https://github.com/vectordotdev/vector/issues/24687
      - DOCKER_API_VERSION=1.44
    volumes:
      - $DOCKER_SOCKET:/var/run/docker.sock
      - $HOME/.aws/:/home/.aws/

volumes:
  # Also mounted in the test runner; see `runner.volumes` in test.yaml.
  aws-emulator-credentials:
    name: aws_aws-emulator-credentials
    external: true

networks:
  default:
    name: ${VECTOR_NETWORK}
    external: true
