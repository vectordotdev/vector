[alias]
vdev = "run --quiet --package vdev --"

# Allow time for newly published dependency versions to be reviewed.
[registry]
global-min-publish-age = "7 days"

[env]
# Build jemalloc assuming 64K pages so binaries also run on aarch64 hosts whose
# kernels ship with a 64K page size (notably EL8 aarch64). On 4K-page hosts this
# coarsens jemalloc's allocation granularity; no regression was measured in
# https://github.com/vectordotdev/vector/pull/18481.
JEMALLOC_SYS_WITH_LG_PAGE = "16"
# Zero out timestamps in macOS static archives so vendored C libraries (openssl,
# curl, librdkafka) produce deterministic artifacts. Ignored on Linux.
ZERO_AR_DATE = "1"
# OpenSSL embeds the exact compile time ("built on: ...") in libcrypto.a.
# Setting SOURCE_DATE_EPOCH to a fixed epoch makes OpenSSL 3.x use a
# reproducible timestamp instead, producing identical artifacts across builds.
SOURCE_DATE_EPOCH = "0"

[target.'cfg(all())']
rustflags = [
  "-D", "warnings",
  "-Dclippy::print_stdout",
  "-Dclippy::print_stderr",
  "-Dclippy::dbg_macro",
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-rdynamic"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-rdynamic"]

[target.x86_64-pc-windows-msvc]
# https://github.com/dtolnay/inventory/issues/58
rustflags = ["-C", "codegen-units=1", "-Ctarget-feature=+crt-static"]
